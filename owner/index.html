<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Nexa Owner</title>
<link rel="icon" href="../icon-192-v3.png">
<style>
:root{--ac:#3d7bff;--ac2:#5aa2ff;--mint:#5ff2c8;--text:#eef2ff;--mute:rgba(220,228,255,.68);--line:rgba(255,255,255,.14)}
*{box-sizing:border-box;margin:0}
body{min-height:100vh;font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--text);background:#05070f url(../sky.jpg) center/cover fixed;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0;background:radial-gradient(60% 40% at 20% 10%,rgba(22,199,154,.25),transparent 70%),radial-gradient(50% 40% at 90% 80%,rgba(138,92,255,.25),transparent 70%),rgba(4,6,18,.35);pointer-events:none}
.wrap{position:relative;max-width:1180px;margin:0 auto;padding:24px 18px 60px}
.glass{background:radial-gradient(150% 100% at 25% -20%,rgba(255,255,255,.18),transparent 46%),linear-gradient(165deg,rgba(255,255,255,.10),rgba(255,255,255,.02) 50%,rgba(255,255,255,.06)),rgba(12,16,42,.35);backdrop-filter:blur(14px) saturate(1.8);-webkit-backdrop-filter:blur(14px) saturate(1.8);box-shadow:inset 2px 2px 1px -1px rgba(255,255,255,.75),inset -2px -2px 1px -1px rgba(255,255,255,.3),inset 0 0 0 1px rgba(255,255,255,.1),0 24px 50px -24px rgba(0,0,0,.7);border-radius:28px}
.card{padding:22px}
h1{font-size:28px;letter-spacing:-.02em}h2{font-size:17px;margin-bottom:10px}
.mute{color:var(--mute)}.small{font-size:13px}
.row{display:flex;align-items:center;gap:10px}.spread{justify-content:space-between}.wrapflex{flex-wrap:wrap}
.btn{height:44px;padding:0 20px;border-radius:999px;border:0;color:#fff;font-weight:700;font-size:15px;cursor:pointer;background:rgba(255,255,255,.1);box-shadow:inset 1px 1px 0 rgba(255,255,255,.4),inset 0 0 0 1px rgba(255,255,255,.1);display:inline-flex;align-items:center;gap:8px}
.btn.pri{background:radial-gradient(120% 90% at 30% -10%,rgba(255,255,255,.5),transparent 50%),linear-gradient(135deg,var(--ac),var(--ac2));box-shadow:inset 1px 1.5px 0 rgba(255,255,255,.7),0 10px 24px -10px var(--ac)}
.btn:disabled{opacity:.6;cursor:default}
.inp{width:100%;height:50px;border-radius:16px;border:0;padding:0 16px;font-size:17px;color:#fff;background:rgba(255,255,255,.08);box-shadow:inset 1px 1px 0 rgba(255,255,255,.35),inset 0 0 0 1px rgba(255,255,255,.12);outline:none}
.inp:focus{box-shadow:inset 1px 1px 0 rgba(255,255,255,.35),0 0 0 3px rgba(95,242,200,.35)}
.code{letter-spacing:.5em;text-align:center;font-size:24px;font-weight:700}
label{display:flex;flex-direction:column;gap:8px;font-weight:700;font-size:14px}
.err{color:#ff9aa8;font-weight:600;font-size:14px}.ok{color:var(--mint);font-weight:600;font-size:14px}
.gate{max-width:440px;margin:8vh auto 0;display:flex;flex-direction:column;gap:16px}
.logo{width:56px;height:56px;border-radius:16px;background:url(../icon-192-v3.png) center/cover;box-shadow:0 0 40px rgba(80,140,255,.6)}
.steps{display:flex;gap:6px}.steps i{height:5px;flex:1;border-radius:3px;background:rgba(255,255,255,.18)}.steps i.on{background:var(--mint)}
.qr{background:#fff;border-radius:18px;padding:10px;width:220px;align-self:center}.qr svg{display:block;width:100%;height:auto}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.tile{padding:16px 18px;display:flex;flex-direction:column;gap:6px;border-radius:22px}.tile b{font-size:32px;font-weight:800;letter-spacing:-.02em}
.bars{display:grid;grid-template-columns:repeat(30,minmax(0,1fr));gap:4px;height:180px;align-items:end;margin-top:6px}
.bar{display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;gap:3px;font-size:10px}
.bar i{width:100%;min-height:2px;border-radius:6px 6px 2px 2px;background:linear-gradient(180deg,var(--mint),var(--ac))}
.bar i.act{background:rgba(255,255,255,.25)}
.legend{display:flex;gap:16px;font-size:12px}.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px;background:linear-gradient(180deg,var(--mint),var(--ac))}.legend span.a::before{background:rgba(255,255,255,.3)}
.table{overflow-x:auto;margin-top:8px}
.tr{display:grid;grid-template-columns:1.2fr 1fr 1.7fr .8fr .9fr;gap:12px;padding:11px 8px;border-bottom:1px solid rgba(255,255,255,.08);font-size:14px;min-width:700px;align-items:center}
.tr.h{font-size:12px;font-weight:800;color:var(--mute);text-transform:uppercase;letter-spacing:.06em;cursor:pointer;user-select:none}
.ellip{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.online{color:var(--mint);font-weight:700}
.grid2{display:grid;grid-template-columns:2fr 1fr;gap:16px}
.pill{display:inline-flex;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:700;background:rgba(255,255,255,.1)}
.top{position:sticky;top:12px;z-index:5;padding:14px 18px;margin-bottom:16px}
@media (max-width:820px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}.grid2{grid-template-columns:1fr}.bars{gap:2px}.bar span{display:none}.tile b{font-size:26px}}
.choices{display:flex;flex-direction:column;gap:8px}.choice{display:flex;flex-direction:column;gap:3px;text-align:left;padding:12px 14px;border-radius:18px;border:0;color:#fff;cursor:pointer;background:rgba(255,255,255,.07);box-shadow:inset 1px 1px 0 rgba(255,255,255,.3),inset 0 0 0 1px rgba(255,255,255,.1);font-size:15px}.choice.on{background:rgba(95,242,200,.16);box-shadow:inset 1px 1px 0 rgba(255,255,255,.4),0 0 0 2px rgba(95,242,200,.6)}
</style></head>
<body><div class="wrap" id="app"><div class="gate glass card"><div class="row"><div class="logo"></div><div><h1>Nexa Owner</h1><div class="mute small">Loading…</div></div></div></div></div>
<script type="module">
import CONFIG from '../config.js';
const OWNER_EMAIL = 'etihadairways1028@gmail.com';
const V = '11.10.0', base = CONFIG.firebase?.sdkBase || `https://www.gstatic.com/firebasejs/${V}/`;
const [F, A] = await Promise.all([import(base + 'firebase-app.js'), import(base + 'firebase-auth.js')]);
const app = F.initializeApp(CONFIG.firebase, 'owner'); const auth = A.getAuth(app);
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const S = { step: 'loading', err: '', okMsg: '', busy: false, session: sessionStorage.getItem('nexa.owner.session') || '', data: null, q: '', sort: 'joined' };
const fn = CONFIG.ownerEndpoint || '/.netlify/functions/owner';
async function api(action, extra = {}) {
  const tok = await auth.currentUser.getIdToken(true);
  const r = await fetch(fn, { method: 'POST', headers: { authorization: 'Bearer ' + tok, 'content-type': 'application/json' }, body: JSON.stringify({ action, ...extra }) });
  const j = await r.json().catch(() => ({ error: 'Server error' })); if (!r.ok) { const e = new Error(j.message || j.error || 'Something went wrong'); e.code = j.error; throw e; } return j;
}
const head = (t, sub, n) => `<div class="row"><div class="logo"></div><div><h1>${t}</h1><div class="mute small">${sub}</div></div></div>${n ? `<div class="steps">${[1, 2, 3].map(i => `<i class="${i <= n ? 'on' : ''}"></i>`).join('')}</div>` : ''}`;
const msg = () => (S.err ? `<div class="err">${esc(S.err)}</div>` : '') + (S.okMsg ? `<div class="ok">${esc(S.okMsg)}</div>` : '');
function render() {
  const el = $('#app');
  if (S.step === 'loading') { el.innerHTML = `<div class="gate glass card">${head('Nexa Owner', 'Loading…')}</div>`; return; }
  if (S.step === 'signin') { el.innerHTML = `<form class="gate glass card" id="f-signin">${head('Nexa Owner', 'Step 1 of 3 · Sign in', 1)}<label>Email<input class="inp" value="${OWNER_EMAIL}" disabled></label><label>Password<input class="inp" id="pw" type="password" autocomplete="current-password" required autofocus></label>${msg()}<button class="btn pri" ${S.busy ? 'disabled' : ''}>${S.busy ? 'Signing in…' : 'Continue'}</button><a class="small mute" href="#" id="forgot">Forgot password?</a></form>`; return; }
  if (S.step === 'verify') { el.innerHTML = `<div class="gate glass card">${head('One-time check', 'Prove this account is yours', 1)}<div class="mute small" style="line-height:1.6">Copy your account ID below and save it in Netlify, so only this account can ever open the owner page:</div><div class="row" style="gap:8px"><input class="inp" id="uidbox" readonly value="${esc(S.uid || '')}" style="font-size:14px"><button class="btn" id="copyuid">Copy</button></div><ol class="mute small" style="padding-left:18px;line-height:1.8"><li>Netlify → your site → <b>Site configuration → Environment variables</b></li><li><b>Add a variable</b> → Key: <b>OWNER_UID</b> → Value: paste the ID → Create</li><li><b>Deploys → Trigger deploy → Deploy site</b>, wait ~1 minute</li><li>Come back and tap <b>Done</b></li></ol>${msg()}<div class="row wrapflex"><button class="btn pri" id="vdone">Done</button><button class="btn" id="vsend">Or verify by email</button><button class="btn" id="out">Sign out</button></div></div>`; return; }
  if (S.step === 'setup') { const mth = S.method || 'nexa'; el.innerHTML = `<form class="gate glass card" id="f-setup">${head('Set up your locks', 'First time only · Step 2 of 3', 2)}<div class="mute small">Choose an owner PIN (6–12 numbers). You'll need it every time you open this page.</div><label>New owner PIN<input class="inp code" id="pin1" inputmode="numeric" pattern="[0-9]*" type="password" minlength="6" maxlength="12" required autofocus></label><label>Type it again<input class="inp code" id="pin2" inputmode="numeric" pattern="[0-9]*" type="password" minlength="6" maxlength="12" required></label>
      <div style="font-weight:700;font-size:14px">How should we send your verification code?</div>
      <div class="choices">${[['nexa', '📱 To my @shiv account in Nexa', 'A notification on your phone. Nothing else to set up.'], ['email', '✉️ To my email', S.emailReady ? 'Sent to ' + OWNER_EMAIL : 'Needs a free Resend key in Netlify first (see below).'], ['totp', '🔐 Google Authenticator', 'Codes from the Google Authenticator app.']].map(([k, t, d]) => `<button type="button" class="choice ${mth === k ? 'on' : ''}" data-method="${k}"><b>${t}</b><span class="mute small">${d}</span></button>`).join('')}</div>
      ${mth === 'email' && !S.emailReady ? `<ol class="mute small" style="padding-left:18px;line-height:1.7"><li>Go to <b>resend.com</b> and sign up with <b>${OWNER_EMAIL}</b></li><li><b>API Keys → Create API key</b> → copy it</li><li>Netlify → <b>Environment variables</b> → add <b>RESEND_API_KEY</b> = the key → Deploys → <b>Trigger deploy</b></li></ol>` : ''}
      ${msg()}<button class="btn pri" ${S.busy ? 'disabled' : ''}>Next</button></form>`; return; }
  if (S.step === 'scan') { el.innerHTML = `<form class="gate glass card" id="f-confirm">${head('Turn on 2-step verification', 'First time only · Step 3 of 3', 3)}<ol class="mute small" style="padding-left:18px;line-height:1.7"><li>Install <b>Google Authenticator</b> on your phone.</li><li>Tap <b>+</b> → <b>Scan a QR code</b> and scan this:</li></ol><div class="qr">${S.qr || ''}</div><div class="mute small" style="text-align:center">Can't scan? Tap <b>Enter a setup key</b> and type:<br><b style="letter-spacing:.08em;word-break:break-all">${esc(S.secret || '')}</b></div><label>Type the 6-digit code it shows<input class="inp code" id="c1" inputmode="numeric" maxlength="6" autocomplete="one-time-code" required autofocus></label>${msg()}<button class="btn pri" ${S.busy ? 'disabled' : ''}>Turn it on</button></form>`; return; }
  if (S.step === 'unlock') { const tot = S.method === 'totp'; el.innerHTML = `<form class="gate glass card" id="f-unlock">${head('Unlock', tot ? 'PIN + Google Authenticator code' : 'PIN + verification code', 3)}<label>Owner PIN<input class="inp code" id="pin" inputmode="numeric" type="password" maxlength="12" required autofocus value="${esc(S.pinDraft || '')}"></label>${tot ? '' : `<div class="row spread wrapflex"><span class="mute small">${S.sentTo ? 'Code sent to <b>' + esc(S.sentTo) + '</b>' : 'We\'ll send a 6-digit code to ' + (S.method === 'email' ? 'your email' : 'your @shiv account in Nexa')}</span><button type="button" class="btn" id="sendcode" ${S.sending ? 'disabled' : ''}>${S.sending ? 'Sending…' : S.sentTo ? 'Send again' : 'Send code'}</button></div>`}<label>${tot ? '6-digit code from Google Authenticator' : '6-digit verification code'}<input class="inp code" id="code" inputmode="numeric" maxlength="6" autocomplete="one-time-code" required></label>${msg()}<button class="btn pri" ${S.busy ? 'disabled' : ''}>${S.busy ? 'Checking…' : 'Unlock'}</button><button type="button" class="btn" id="out">Sign out</button></form>`; return; }
  if (S.step === 'dash') { el.innerHTML = dash(); return; }
}
const fmtD = t => t ? new Date(t).toLocaleDateString([], { day: 'numeric', month: 'short', year: 'numeric' }) : '—';
const ago = t => { if (!t) return '—'; const d = Date.now() - t; if (d < 3 * 60e3) return '<span class="online">Online now</span>'; if (d < 3600e3) return Math.round(d / 60e3) + ' min ago'; if (d < 864e5) return Math.round(d / 3600e3) + ' h ago'; return Math.round(d / 864e5) + ' days ago'; };
function dash() {
  const d = S.data; if (!d) return `<div class="gate glass card">${head('Loading your dashboard…', '')}</div>`;
  const st = d.stats, q = S.q.toLowerCase().trim();
  let users = d.users.filter(u => !q || [u.name, u.handle, u.email].some(x => (x || '').toLowerCase().includes(q)));
  const sorters = { joined: (a, b) => b.joined - a.joined, active: (a, b) => b.lastActive - a.lastActive, name: (a, b) => (a.name || 'zz').localeCompare(b.name || 'zz'), handle: (a, b) => (a.handle || 'zz').localeCompare(b.handle || 'zz'), email: (a, b) => a.email.localeCompare(b.email) };
  users = users.sort(sorters[S.sort] || sorters.joined);
  const tile = (n, l) => `<div class="tile glass"><span class="mute small">${l}</span><b>${n ?? '—'}</b></div>`;
  const max = Math.max(1, ...d.signups.map(x => Math.max(x.n, x.active)));
  return `<div class="top glass row spread wrapflex"><div class="row"><div class="logo" style="width:40px;height:40px;border-radius:12px"></div><div><b style="font-size:18px">Nexa Owner</b><div class="mute small">Updated ${new Date(d.at).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' })} · only you can see this</div></div></div><div class="row"><button class="btn" id="refresh">Refresh</button><button class="btn" id="csv">Export CSV</button><button class="btn" id="out">Lock</button></div></div>
  <div class="tiles">${tile(st.users, 'People on Nexa')}${tile(st.onlineNow, 'Online now')}${tile(st.active24h, 'Active today')}${tile(st.active7d, 'Active this week')}${tile(st.new24h, 'Joined today')}${tile(st.new7d, 'Joined this week')}${tile(st.messages, 'Messages sent')}${tile(st.chats, 'Chats')}${tile(st.groups, 'Group chats')}${tile(st.friendships, 'Friendships')}${tile(st.events, 'Events')}${tile(st.moments, 'Moments')}</div>
  <div class="grid2" style="margin-top:16px"><section class="glass card"><div class="row spread"><h2>Last 30 days</h2><div class="legend mute"><span>Joined</span><span class="a">Active</span></div></div><div class="bars">${d.signups.map(x => `<div class="bar" title="${new Date(x.day).toLocaleDateString()} · ${x.n} joined · ${x.active} active"><span>${x.n || ''}</span><div style="display:flex;gap:1px;align-items:flex-end;height:100%;width:100%"><i style="height:${x.n / max * 100}%"></i><i class="act" style="height:${x.active / max * 100}%"></i></div></div>`).join('')}</div></section>
  <section class="glass card"><h2>Safety</h2><div class="col" style="display:flex;flex-direction:column;gap:10px"><div class="row spread"><span class="mute">Reports</span><b>${st.reports ?? '—'}</b></div><div class="row spread"><span class="mute">Banned accounts</span><b>${st.bans ?? '—'}</b></div><div class="row spread"><span class="mute">Didn't finish sign-up</span><b>${st.unfinished}</b></div></div><div class="mute small" style="margin-top:12px;line-height:1.5">Help messages from people come to your <b>@owner</b> account in Nexa.</div></section></div>
  <section class="glass card" style="margin-top:16px"><div class="row spread wrapflex"><h2>Everyone (${users.length})</h2><input class="inp" id="q" placeholder="Search name, @username or email" value="${esc(S.q)}" style="max-width:340px;height:44px;font-size:15px"></div>
  <div class="table"><div class="tr h">${[['name', 'Name'], ['handle', 'Username'], ['email', 'Login email'], ['joined', 'Joined'], ['active', 'Last active']].map(([k, l]) => `<span data-sort="${k}">${l}${S.sort === k ? ' ▾' : ''}</span>`).join('')}</div>
  ${users.map(u => `<div class="tr"><span class="ellip"><b>${esc(u.name || '(didn\'t finish sign-up)')}</b>${u.deleted ? ' <span class="pill">deleted</span>' : ''}</span><span class="ellip">${u.handle ? '@' + esc(u.handle) : '—'}</span><span class="ellip">${esc(u.email || '—')}${u.verified ? ' <span class="pill">verified</span>' : ''}</span><span>${fmtD(u.joined)}</span><span>${ago(u.lastActive)}</span></div>`).join('') || '<div class="mute" style="padding:20px">No one matches that.</div>'}</div></section>`;
}
async function loadData() {
  try { S.data = await api('data', { session: S.session }); S.step = 'dash'; S.err = ''; }
  catch (e) { if (e.code === 'session') { S.session = ''; sessionStorage.removeItem('nexa.owner.session'); S.step = 'unlock'; S.err = e.message; } else S.err = e.message; }
  render();
}
async function route() {
  const u = auth.currentUser;
  if (!u) { S.step = 'signin'; return render(); }
  if ((u.email || '').toLowerCase() !== OWNER_EMAIL) { await A.signOut(auth); S.step = 'signin'; S.err = 'This page is only for the owner of Nexa.'; return render(); }
  try { const st = await api('status'); S.method = st.method || S.method; S.emailReady = st.emailReady; if (!st.setup) { S.step = 'setup'; return render(); } if (S.session) { S.step = 'dash'; render(); return loadData(); } S.step = 'unlock'; render(); }
  catch (e) { if (e.code === 'verify-email') { S.uid = u.uid; S.err = ''; S.step = 'verify'; return render(); } S.err = e.message; S.step = 'signin'; render(); }
}
A.onAuthStateChanged(auth, () => route());
document.addEventListener('submit', async e => {
  e.preventDefault(); const id = e.target.id; const v = Object.fromEntries([...e.target.querySelectorAll('input')].map(i => [i.id, i.value])); S.err = ''; S.okMsg = ''; S.busy = true; render();
  try {
    if (id === 'f-signin') { const pw = v.pw; await A.signInWithEmailAndPassword(auth, OWNER_EMAIL, pw); }
    if (id === 'f-setup') { const p1 = v.pin1, p2 = v.pin2; if (p1 !== p2) throw new Error('The two PINs don\'t match.'); if (!/^\d{6,12}$/.test(p1)) throw new Error('Use 6 to 12 numbers.'); const r = await api('setup', { pin: p1, method: S.method || 'nexa' }); if (r.ok) { S.method = r.method; S.step = 'unlock'; S.okMsg = 'All set! Tap Send code to get your first code.'; S.busy = false; render(); return; } S.secret = r.secret; const Q = (await import('../qr.js')).default; const q = Q(0, 'M'); q.addData(r.otpauth); q.make(); S.qr = q.createSvgTag({ cellSize: 5, margin: 2, scalable: true }); S.step = 'scan'; }
    if (id === 'f-confirm') { await api('confirm', { code: v.c1 }); S.method = 'totp'; S.step = 'unlock'; S.okMsg = '2-step verification is on. Now unlock with your PIN and a fresh code.'; S.secret = ''; S.qr = ''; }
    if (id === 'f-unlock') { const r = await api('login', { pin: v.pin, code: v.code }); S.session = r.session; sessionStorage.setItem('nexa.owner.session', r.session); S.step = 'dash'; S.busy = false; render(); return loadData(); }
  } catch (err) { S.err = /auth\/(wrong-password|invalid-credential|invalid-login|user-not-found)/.test(err.code || '') ? 'Wrong password — or there\'s no Nexa account with this email yet. Sign up in Nexa first.' : /too-many-requests/.test(err.code || '') ? 'Too many tries. Wait a few minutes.' : err.message; }
  S.busy = false; render();
});
document.addEventListener('click', async e => {
  const t = e.target.closest('button,a,[data-sort]'); if (!t) return;
  if (t.id === 'out') { S.session = ''; sessionStorage.removeItem('nexa.owner.session'); S.data = null; await A.signOut(auth); }
  if (t.id === 'refresh') { t.textContent = 'Refreshing…'; loadData(); }
  if (t.id === 'forgot') { e.preventDefault(); try { await A.sendPasswordResetEmail(auth, OWNER_EMAIL); S.okMsg = 'Password reset link sent to ' + OWNER_EMAIL; } catch (er) { S.err = er.message; } render(); }
  if (t.id === 'vsend') { try { await A.sendEmailVerification(auth.currentUser); S.okMsg = 'Sent! Check your inbox (and spam).'; } catch (er) { S.err = er.message; } render(); }
  if (t.id === 'vdone') route();
  if (t.dataset.method) { S.method = t.dataset.method; const p1 = $('#pin1')?.value, p2 = $('#pin2')?.value; render(); if (p1) $('#pin1').value = p1; if (p2) $('#pin2').value = p2; }
  if (t.id === 'sendcode') { S.pinDraft = $('#pin')?.value || ''; S.sending = true; S.err = ''; S.okMsg = ''; render(); try { const r = await api('sendCode'); S.sentTo = r.to; S.okMsg = 'Code sent! It works for 10 minutes.'; } catch (er) { S.err = er.message; } S.sending = false; render(); setTimeout(() => $('#code')?.focus(), 50); }
  if (t.id === 'copyuid') { navigator.clipboard?.writeText(S.uid || ''); t.textContent = 'Copied ✓'; }
  if (t.dataset.sort) { S.sort = t.dataset.sort; render(); }
  if (t.id === 'csv' && S.data) { const rows = [['Name', 'Username', 'Login email', 'Verified', 'Joined', 'Last active'], ...S.data.users.map(u => [u.name, u.handle ? '@' + u.handle : '', u.email, u.verified ? 'yes' : 'no', u.joined ? new Date(u.joined).toISOString() : '', u.lastActive ? new Date(u.lastActive).toISOString() : ''])]; const csv = rows.map(r => r.map(x => '"' + String(x || '').replace(/"/g, '""') + '"').join(',')).join('\n'); const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv' })); a.download = 'nexa-people-' + new Date().toISOString().slice(0, 10) + '.csv'; a.click(); }
});
document.addEventListener('input', e => { if (e.target.id === 'q') { S.q = e.target.value; const pos = e.target.selectionStart; render(); const q = $('#q'); q.focus(); q.setSelectionRange(pos, pos); } });
// auto-refresh every minute while open
setInterval(() => { if (S.step === 'dash' && document.visibilityState === 'visible') loadData(); }, 60000);
// lock after 30 minutes away
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') S.hiddenAt = Date.now(); else if (S.hiddenAt && Date.now() - S.hiddenAt > 30 * 60e3) { S.session = ''; sessionStorage.removeItem('nexa.owner.session'); S.step = 'unlock'; render(); } });
</script></body></html>
