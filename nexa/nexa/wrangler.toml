# Cloudflare Pages settings for Nexa (read automatically when Cloudflare builds from GitHub).
name = "nexa"
pages_build_output_dir = "."
compatibility_date = "2025-06-01"
compatibility_flags = ["nodejs_compat"]

# Nexa AI (free): Cloudflare Workers AI, used by the app, Nexa Support, Nexa Studio and Nexa Dev Hub
[ai]
binding = "AI"
