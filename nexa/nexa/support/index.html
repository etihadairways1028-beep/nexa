<style>
/* ===== Nexa Support 3.0: the Nexa app's own design, plus a few support-only pieces ===== */
body{overflow:hidden}
.sx-logo{border-radius:28%;display:block;flex:none;box-shadow:0 0 24px -6px var(--ac)}
.brand .word{letter-spacing:.24em;font-size:16px}
.sx-page{padding:0 2px 24px;display:flex;flex-direction:column;gap:16px}
.sx-page[data-tab="chats"]{overflow:hidden;padding-bottom:0}
.sx-head{padding:6px 4px 0}.sx-head .h1{font-size:30px}
.sx-page[data-tab="chats"] .sx-head{display:none}
.sx-live{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;font-weight:700;color:var(--mute);white-space:nowrap}
.sx-live i{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 10px var(--ok);animation:sxp 2s infinite}
@keyframes sxp{50%{opacity:.35}}
.sx-team{display:flex}.sx-team .sx-tm{margin-left:-8px;border-radius:50%;box-shadow:0 0 0 2px var(--ground)}
.sx-kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.sx-kpi{display:flex;flex-direction:column;align-items:flex-start;gap:8px;padding:18px;text-align:left;position:relative;overflow:hidden;cursor:pointer}
.sx-kpi:hover{transform:translateY(-3px)}
.sx-kpi .sx-kic{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;color:#fff;background:color-mix(in oklab,var(--kc) 70%,transparent);box-shadow:0 8px 20px -10px var(--kc),inset 0 1px 0 rgba(255,255,255,.35)}
.sx-kpi b{font-family:var(--display);font-size:32px;line-height:1;letter-spacing:-.02em}
.sx-kpi .mute{font-size:13px;font-weight:600}
.sx-kpi.hot{border-color:color-mix(in oklab,var(--hot) 60%,transparent)}.sx-kpi.hot b{color:#ff9aae}
.sx-kpi::after{content:"";position:absolute;right:-40px;top:-40px;width:130px;height:130px;border-radius:50%;background:radial-gradient(circle,color-mix(in oklab,var(--kc) 30%,transparent),transparent 70%);pointer-events:none}
.sx-up{color:var(--ok);font-weight:800}.sx-down{color:var(--hot);font-weight:800}
.sx-cols{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:16px;align-items:start}
.sx-cols>*{min-width:0}
.sx-q{background:rgba(255,255,255,.03);border-color:var(--line2)}
.sx-kind{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;flex:none;color:var(--kc);background:color-mix(in oklab,var(--kc) 18%,transparent)}
.sx-spark{display:flex;align-items:flex-end;gap:6px;height:70px;padding:4px 0}
.sx-spark i{flex:1;border-radius:6px 6px 3px 3px;opacity:.85;min-height:4px}
.sx-tips{display:flex;flex-direction:column;gap:8px;font-size:13.5px;color:var(--mute)}
/* chats: three panes, like Nexa's Messages */
.sx-msgs{height:100%;min-height:0}
.sx-msgs.sx3{grid-template-columns:var(--convw,330px) minmax(0,1fr) 300px}
.sx-list{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:2px;margin:0 -6px;padding:0 6px}
.sx-pills{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}.sx-pills::-webkit-scrollbar{display:none}
.sx-pills .badge,.pills .badge{min-width:18px;height:18px;font-size:10.5px;margin-left:4px}
.sx-tags{display:flex;gap:4px;flex-wrap:wrap;margin-top:4px}.sx-tags:empty{display:none}
.sx-tags .pill{height:22px;padding:0 8px;font-size:11px}
.pill.sx-mine{background:linear-gradient(135deg,var(--warm),var(--hot));color:#fff;border-color:transparent}
.sx-rt{display:flex;align-items:center;gap:8px}
.chathead .btn.sm{white-space:nowrap}
.sx-img{max-width:260px;max-height:300px;border-radius:14px;display:block}
.sx-qr{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:0 2px 8px}.sx-qr::-webkit-scrollbar{display:none}
.sx-qr .chip{flex:none;white-space:nowrap}
.sx-x{margin-left:6px;opacity:.55;cursor:pointer;background:none;border:0;color:inherit;font:inherit}
.sx-x:hover{opacity:1}
.sx-emoji{display:grid;grid-template-columns:repeat(12,1fr);gap:2px;padding:8px;border-radius:18px;margin-bottom:8px}
.sx-emoji button{font-size:22px;height:38px;border-radius:10px}.sx-emoji button:hover{background:rgba(255,255,255,.1)}
.sx-info{overflow-y:auto;gap:12px}
.sx-who{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;padding-bottom:12px;border-bottom:1px solid var(--line2)}
.sx-kv{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:13.5px}
.sx-sel{height:36px;width:auto;max-width:160px;padding:0 10px;font-size:13.5px}
.sx-noteform{display:flex;gap:6px}.sx-noteform .inp{height:38px;font-size:14px}
.sx-note{font-size:13.5px;padding:10px 12px;border-radius:14px;background:color-mix(in oklab,var(--ac) 12%,transparent);border:1px solid color-mix(in oklab,var(--ac) 25%,transparent);line-height:1.45;display:flex;flex-direction:column;gap:4px}
.sx-warn{font-size:13px;padding:10px 12px;border-radius:14px;background:rgba(255,181,71,.1);border:1px solid rgba(255,181,71,.25)}
.sx-acts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:4px}.sx-acts .btn{justify-content:center}
/* lists of cards */
.sx-list2{display:flex;flex-direction:column;gap:10px}
.sx-card{display:flex;flex-direction:column;gap:10px;padding:16px;border-radius:20px;background:rgba(255,255,255,.035);border:1px solid var(--line2)}
.sx-card.hot{border-color:color-mix(in oklab,var(--hot) 55%,transparent);box-shadow:inset 3px 0 0 var(--hot)}
.sx-card.warm{border-color:color-mix(in oklab,var(--warm) 55%,transparent);box-shadow:inset 3px 0 0 var(--warm)}
.sx-quote{padding:11px 14px;border-radius:14px;background:var(--field);border:1px solid var(--line2);line-height:1.5;overflow-wrap:anywhere}
.sx-quote mark{background:color-mix(in oklab,var(--hot) 55%,transparent);color:#fff;border-radius:4px;padding:0 2px}
.btn.danger{background:color-mix(in oklab,var(--hot) 22%,transparent);border-color:color-mix(in oklab,var(--hot) 45%,transparent)}
/* stats */
.sx-chart{width:100%;height:auto;color:var(--text);display:block}
.sx-legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;color:var(--mute)}.sx-legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.sx-agentrow{display:flex;align-items:center;gap:12px;padding:8px 0}
.sx-meter{height:8px;border-radius:99px;background:rgba(255,255,255,.07);overflow:hidden;margin-top:6px}.sx-meter i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--ac),var(--ac2))}
.sx-meter.big{height:12px}
.sx-sets{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;align-items:start}
.sx-smtp{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}
.sx-ta{height:auto;min-height:90px;padding:12px 14px;resize:vertical;line-height:1.45}
/* overlays */
.sx-ov,.sx-pal{position:fixed;inset:0;z-index:60;background:rgba(4,6,14,.55);display:flex;align-items:center;justify-content:center;padding:16px}
.sx-pal{align-items:flex-start;padding-top:12vh}
.sx-palbox{padding:12px;gap:8px;max-height:70vh}
.sx-palres{overflow-y:auto;display:flex;flex-direction:column;gap:2px}
.item.on{background:color-mix(in oklab,var(--ac) 16%,transparent);border-color:color-mix(in oklab,var(--ac) 30%,transparent)}
.sx-toast{position:fixed;right:22px;bottom:22px;z-index:70;padding:13px 18px;border-radius:18px;font-weight:600;font-size:14px;max-width:min(420px,90vw);animation:msgIn .3s}
/* sign in */
.sx-gate{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:16px;overflow:auto}
.sx-gatebox{width:min(520px,100%)}
.sx-agents{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.sx-agent{display:flex;flex-direction:column;align-items:center;gap:6px;padding:18px 8px;border-radius:20px;border:1px solid var(--line);background:rgba(255,255,255,.04);transition:transform .2s,border-color .2s}
.sx-agent:hover{transform:translateY(-3px)}.sx-agent.on{border-color:var(--ac);box-shadow:0 0 0 2px color-mix(in oklab,var(--ac) 50%,transparent)}
.err{color:#ff9aa8;font-weight:600;font-size:14px}.ok{color:var(--ok);font-weight:600;font-size:14px}
@media (max-width:1280px){.sx-msgs.sx3{grid-template-columns:var(--convw,300px) minmax(0,1fr)}.sx-msgs.sx3 .sx-info{display:none}.sx-kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:1100px){.sx-sets{grid-template-columns:1fr}.sx-team{display:none}}
@media (max-width:900px){.sx-cols{grid-template-columns:1fr}}
@media (max-width:700px){
  .sx-page{padding:0 12px calc(96px + env(safe-area-inset-bottom))}
  .sx-head .h1{font-size:24px}
  .sx-msgs.sx3{grid-template-columns:1fr}
  .sx-page[data-tab="chats"]{padding:0 12px calc(90px + env(safe-area-inset-bottom))}
  .sx-toast{left:12px;right:12px;bottom:96px}
  .sx-emoji{grid-template-columns:repeat(8,1fr)}
  .chathead .sx-rt .small{display:none}
  .sx-q .sx-kind,.sx-q>.mute.small{display:none}
  .sx-msgs .convs>.row.spread{flex-direction:row;justify-content:space-between}
  .sx-msgs .convs>.row.spread h2{display:block!important;text-align:left}
}
</style></head>

<script type="module">
import CONFIG from '../config.js';
const SUPPORT_EMAIL = 'nexaconnectofficial@gmail.com';
const V = '11.10.0', base = CONFIG.firebase?.sdkBase || `https://www.gstatic.com/firebasejs/${V}/`;
// Firebase is only loaded for phone/computer alerts — there's no email sign-in
let app = null; async function fbApp() { if (!app) { const F = await import(base + 'firebase-app.js'); app = F.initializeApp(CONFIG.firebase, 'support'); } return app; }
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const store = { get: k => { try { return localStorage.getItem(k); } catch { return null; } }, set: (k, v) => { try { v ? localStorage.setItem(k, v) : localStorage.removeItem(k); } catch {} } };
const TABS = [['home', 'Home'], ['chats', 'Chats'], ['flags', 'Flags'], ['reports', 'Reports'], ['jobs', 'Jobs'], ['people', 'People'], ['stats', 'Stats'], ['updates', 'Updates'], ['settings', 'Settings']];
const hashTab = () => { const h = location.hash.replace('#', ''); return h === 'inbox' ? 'chats' : TABS.some(t => t[0] === h) ? h : 'home'; };
const S = { step: 'loading', err: '', okMsg: '', busy: false, session: store.get('nexa.support.session') || '', agent: JSON.parse(store.get('nexa.support.agent') || 'null'), tab: hashTab(), cid: '', drafts: {}, sound: store.get('nexa.support.sound') !== '0', desk: store.get('nexa.support.desk') === '1', flagFilter: 'open', repFilter: 'open', q: '', people: [], agents: [] };
const fn = CONFIG.supportEndpoint || '/api/support';
async function runPushes(job, onStep) {
  // sends the phone notifications in small rounds until everyone has one; a hiccup is retried, and if it still fails we say how far it got
  let from = 0, pushed = 0, total = 0;
  while (job) {
    let r = null;
    for (let t = 0; t < 3 && !r; t++) { try { r = await api('pushJob', { job, from }); } catch (e) { if (e.code === 'session' || t === 2) { alert(`Everyone got the in-app notification, but phone notifications stopped at ${from}/${total || '?'} (${e.message}).`); return pushed; } await new Promise(res => setTimeout(res, 1500 * (t + 1))); } }
    pushed += r.pushed || 0; from = r.next; total = r.total || total; onStep && onStep(from, total, pushed);

  }
  return pushed;
}
async function api(action, extra = {}) {
  const r = await fetch(fn, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ action, session: S.session, ...extra }) });
  const j = await r.json().catch(() => ({ error: 'Server error' }));

}
const head = (t, sub) => `<div class="row"><div class="logo"></div><div><h1>${t}</h1><div class="mute small">${sub}</div></div></div>`;
const msg = () => (S.err ? `<div class="err">${esc(S.err)}</div>` : '') + (S.okMsg ? `<div class="ok">${esc(S.okMsg)}</div>` : '');
const initials = n => esc((n || '?').trim()[0]?.toUpperCase() || '?');
const hm = t => { if (!t) return ''; const d = new Date(t), td = new Date(); return d.toDateString() === td.toDateString() ? d.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' }) : d.toLocaleDateString([], { day: 'numeric', month: 'short' }) + ' ' + d.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' }); };

const TEMPLATES = [['Welcome', 'Welcome to Nexa! 🎉 We\'re so happy you\'re here. If you ever need help, just message Nexa Support.'], ['Thanks for reporting', 'Thanks for your report — our team is looking into it. We\'ll take action if it breaks the rules.'], ['Fixed', 'Good news — that\'s fixed now! Let us know if anything else comes up.'], ['Update', 'Hi! There\'s a new Nexa update with new features — check it out. 🚀']];

// ================= Nexa Support 3.0 — built from the same parts as the Nexa app =================
const I = { home: '<path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>', chats: '<path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/>', flags: '<path d="M5 21V4M5 4h11l-2 4 2 4H5"/>', reports: '<path d="M9 4h6l1 2h3v15H5V6h3z"/><path d="M9 12h6M9 16h4"/>', jobs: '<rect x="3" y="7" width="18" height="13" rx="2"/><path d="M9 7V5h6v2M3 13h18"/>', people: '<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0"/><circle cx="17" cy="9" r="2.5"/><path d="M16 14.5a5 5 0 0 1 5.5 5"/>', stats: '<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>', updates: '<path d="M12 3v12M7 10l5 5 5-5M4 21h16"/>', settings: '<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/>', search: '<circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/>', plus: '<path d="M12 5v14M5 12h14"/>', lock: '<rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/>', swap: '<path d="M7 7h13l-3-3M17 17H4l3 3"/>', globe: '<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/>', ban: '<circle cx="12" cy="12" r="9"/><path d="M6 6l12 12"/>', send: '<path d="M22 2L11 13M22 2l-7 20-4-9-9-4z"/>', smile: '<circle cx="12" cy="12" r="9"/><path d="M8 14s1.5 2 4 2 4-2 4-2M9 9h.01M15 9h.01"/>', photo: '<rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="9" cy="10" r="2"/><path d="M21 16l-5-5-9 9"/>', spark: '<path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"/><path d="M19 16l.7 1.8 1.8.7-1.8.7L19 21l-.7-1.8-1.8-.7 1.8-.7z"/>', check: '<path d="M5 12l5 5 9-11"/>', checks: '<path d="M2 12l5 5 9-11M9 17l2 2 9-11"/>', back: '<path d="M15 18l-6-6 6-6"/>', x: '<path d="M6 6l12 12M18 6L6 18"/>', note: '<path d="M5 3h10l4 4v14H5z"/><path d="M9 12h6M9 16h6"/>', user: '<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>', trash: '<path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/>', warn: '<path d="M12 3l10 18H2z"/><path d="M12 10v4M12 17h.01"/>', zap: '<path d="M13 2L4 14h7l-1 8 9-12h-7z"/>' };
const ic = (k, sz = 20, sw = 1.9) => `<svg width="${sz}" height="${sz}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${I[k] || ''}</svg>`;
const TAB_SUB = { home: 'Everything that needs the team, in one place.', chats: 'Help chats from the Help button in Nexa.', flags: 'Messages Nexa caught with swearing, slurs or threats.', reports: 'When someone taps Report in Nexa.', jobs: 'Nexa Team applications. New ones also arrive as messages to @owner.', people: 'Find anyone to message, warn or ban.', stats: 'How Nexa and the team are doing over the last 14 days.', updates: 'Who is on the newest Nexa.', settings: 'Alerts, auto-reply, email and your password.' };
const festK = (() => { try { const k = JSON.parse(localStorage.getItem('nexa.festIconK') || '""'); return /^(halloween|diwali|christmas)$/.test(k) ? k : ''; } catch { return ''; } })();
const LOGO = `/icon-192-${festK || 'v4'}.png`;
const logo = (sz = 36) => `<img class="sx-logo" src="${LOGO}" alt="Nexa" width="${sz}" height="${sz}" style="width:${sz}px;height:${sz}px">`;
const GRADS = ['linear-gradient(135deg,#5b7cff,#9b6bff)', 'linear-gradient(135deg,#ff8a4c,#ff4d6d)', 'linear-gradient(135deg,#2fd4c4,#3d7bff)', 'linear-gradient(135deg,#ffb547,#ff6b8a)', 'linear-gradient(135deg,#35d58a,#2fa4ff)', 'linear-gradient(135deg,#b794ff,#ff7ab6)'];

const agentAv = (a, sz = 36, dot) => `<span class="av" style="width:${sz}px;height:${sz}px;font-size:${Math.round(sz * .4)}px;--grad:${AGENT_COL[a?.id] || AGENT_COL.shiv}">${initials(a?.name)}${dot ? `<span class="st ${a.online ? 'online' : ''}"></span>` : ''}</span>`;

function badgeN(k) { const n = S.dash?.stats || {}; return k === 'chats' ? (S.inbox?.unread ?? n.waiting) : k === 'flags' ? n.flags : k === 'reports' ? n.reports : k === 'jobs' ? (S.apps || []).filter(a => (a.status || 'new') === 'new').length : 0; }

function render() {

// photos: made small enough to send (max 1280 px, JPEG)
function shrinkImg(file) { return new Promise((res, rej) => { if (!/^image\//.test(file.type)) return rej(new Error('Please pick a photo.')); const u = URL.createObjectURL(file), im = new Image(); im.onload = () => { const k = Math.min(1, 1280 / Math.max(im.width, im.height)); const c = document.createElement('canvas'); c.width = Math.round(im.width * k); c.height = Math.round(im.height * k); c.getContext('2d').drawImage(im, 0, 0, c.width, c.height); URL.revokeObjectURL(u); let q = .82, out = c.toDataURL('image/jpeg', q); while (out.length > 700000 && q > .4) { q -= .12; out = c.toDataURL('image/jpeg', q); } out.length > 740000 ? rej(new Error('That photo is too big.')) : res(out); }; im.onerror = () => rej(new Error('That photo can’t be opened.')); im.src = u; }); }
// ✨ Nexa AI suggests replies (same Gemini models as the Nexa app)
const AI_MODELS = ['gemini-3.8-flash', 'gemini-3.6-flash', 'gemini-3.5-flash-lite', 'gemini-flash-latest', 'gemini-3.1-flash-lite'];
let aiX = null;
async function suggestReplies() {
  const cid = S.cid, t = S.thread; if (!cid || !t) return;
  S.sugg = { cid, loading: true }; renderKeep();
  try {

    const prompt = `You help the Nexa Support team reply to people using Nexa (a messaging app). Write 3 different short, friendly, clear replies Nexa Support could send next. Simple words, no jargon, at most 2 sentences each, never ask for passwords. Reply ONLY as a JSON array of 3 strings.

Chat:
${convo}`;
    let txt = '', last;
    for (const name of AI_MODELS) { try { const m = aiX.X.getGenerativeModel(aiX.inst, { model: name }); txt = (await m.generateContent(prompt)).response.text(); break; } catch (e) { last = e; if (/quota|429|permission|api.?key/i.test(String(e?.message))) break; } }

    if (!arr.length) throw new Error('Nexa AI didn’t answer.');
    if (S.cid === cid) { S.sugg = { cid, items: arr }; renderKeep(); }
  } catch (e) { if (S.cid === cid) { S.sugg = { cid, err: 'Couldn’t get ideas: ' + String(e?.message || e).slice(0, 80) }; renderKeep(); } }
}
