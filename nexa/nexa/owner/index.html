<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Nexa Owner</title>
<link rel="icon" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#05070f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Nexa Owner">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
:root{--ac:#3d7bff;--ac2:#5aa2ff;--mint:#5ff2c8;--text:#eef2ff;--mute:rgba(220,228,255,.68);--line:rgba(255,255,255,.14)}
*{box-sizing:border-box;margin:0}
body{min-height:100vh;font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--text);background:#05070f url(../sky.jpg) center/cover fixed;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0;background:radial-gradient(60% 40% at 20% 10%,rgba(22,199,154,.25),transparent 70%),radial-gradient(50% 40% at 90% 80%,rgba(138,92,255,.25),transparent 70%),rgba(4,6,18,var(--dim,.35));pointer-events:none}
.wrap{position:relative;max-width:1180px;margin:0 auto;padding:24px 18px 60px}
.glass{background:radial-gradient(150% 100% at 25% -20%,rgba(255,255,255,.18),transparent 46%),linear-gradient(165deg,rgba(255,255,255,.10),rgba(255,255,255,.02) 50%,rgba(255,255,255,.06)),rgba(12,16,42,.35);backdrop-filter:blur(14px) saturate(1.8);-webkit-backdrop-filter:blur(14px) saturate(1.8);box-shadow:inset 2px 2px 1px -1px rgba(255,255,255,.75),inset -2px -2px 1px -1px rgba(255,255,255,.3),inset 0 0 0 1px rgba(255,255,255,.1),0 24px 50px -24px rgba(0,0,0,.7);border-radius:28px}
.card{padding:22px}
h1{font-size:28px;letter-spacing:-.02em}h2{font-size:17px;margin-bottom:10px}
.mute{color:var(--mute)}.small{font-size:13px}
.row{display:flex;align-items:center;gap:10px}.spread{justify-content:space-between}.wrapflex{flex-wrap:wrap}
.btn{height:44px;padding:0 20px;border-radius:999px;border:0;color:#fff;font-weight:700;font-size:15px;cursor:pointer;background:rgba(255,255,255,.1);box-shadow:inset 1px 1px 0 rgba(255,255,255,.4),inset 0 0 0 1px rgba(255,255,255,.1);display:inline-flex;align-items:center;gap:8px}
.btn.pri{background:radial-gradient(120% 90% at 30% -10%,rgba(255,255,255,.5),transparent 50%),linear-gradient(135deg,var(--ac),var(--ac2));box-shadow:inset 1px 1.5px 0 rgba(255,255,255,.7),0 10px 24px -10px var(--ac)}
.btn:disabled{opacity:.6;cursor:default}
.inp{width:100%;height:50px;border-radius:16px;border:0;padding:0 16px;font-size:17px;color:#fff;background:rgba(255,255,255,.08);box-shadow:inset 1px 1px 0 rgba(255,255,255,.35),inset 0 0 0 1px rgba(255,255,255,.12);outline:none}
.inp:focus{box-shadow:inset 1px 1px 0 rgba(255,255,255,.35),0 0 0 3px rgba(95,242,200,.35)}
.code::placeholder{letter-spacing:normal;font-size:15px;font-weight:500}
.code{letter-spacing:.5em;text-align:center;font-size:24px;font-weight:700}
label{display:flex;flex-direction:column;gap:8px;font-weight:700;font-size:14px}
.err{color:#ff9aa8;font-weight:600;font-size:14px}.ok{color:var(--mint);font-weight:600;font-size:14px}
.gate{max-width:440px;margin:8vh auto 0;display:flex;flex-direction:column;gap:16px}
.logo{width:56px;height:56px;border-radius:16px;background:url(icon-192.png) center/cover;box-shadow:0 0 40px rgba(80,140,255,.6)}
.steps{display:flex;gap:6px}.steps i{height:5px;flex:1;border-radius:3px;background:rgba(255,255,255,.18)}.steps i.on{background:var(--mint)}
.qr{background:#fff;border-radius:18px;padding:10px;width:220px;align-self:center}.qr svg{display:block;width:100%;height:auto}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.tile{padding:16px 18px;display:flex;flex-direction:column;gap:6px;border-radius:22px}.tile b{font-size:32px;font-weight:800;letter-spacing:-.02em}
.bars{display:grid;grid-template-columns:repeat(30,minmax(0,1fr));gap:4px;height:180px;align-items:end;margin-top:6px}
.bar{display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;gap:3px;font-size:10px}
.bar i{width:100%;min-height:2px;border-radius:6px 6px 2px 2px;background:linear-gradient(180deg,var(--mint),var(--ac))}
.bar i.act{background:rgba(255,255,255,.25)}
.legend{display:flex;gap:16px;font-size:12px}.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px;background:linear-gradient(180deg,var(--mint),var(--ac))}.legend span.a::before{background:rgba(255,255,255,.3)}
.table{overflow-x:auto;margin-top:8px}
.tr{display:grid;grid-template-columns:1.2fr 1fr 1.7fr .8fr .9fr;gap:12px;padding:11px 8px;border-bottom:1px solid rgba(255,255,255,.08);font-size:14px;min-width:700px;align-items:center}
.tr.h{font-size:12px;font-weight:800;color:var(--mute);text-transform:uppercase;letter-spacing:.06em;cursor:pointer;user-select:none}
.ellip{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.online{color:var(--mint);font-weight:700}
.grid2{display:grid;grid-template-columns:2fr 1fr;gap:16px}
.pill{display:inline-flex;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:700;background:rgba(255,255,255,.1)}
.top{position:sticky;top:12px;z-index:5;padding:14px 18px;margin-bottom:16px}
@media (max-width:820px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}.grid2{grid-template-columns:1fr}.bars{gap:2px}.bar span{display:none}.tile b{font-size:26px}}
.choices{display:flex;flex-direction:column;gap:8px}.choice{display:flex;flex-direction:column;gap:3px;text-align:left;padding:12px 14px;border-radius:18px;border:0;color:#fff;cursor:pointer;background:rgba(255,255,255,.07);box-shadow:inset 1px 1px 0 rgba(255,255,255,.3),inset 0 0 0 1px rgba(255,255,255,.1);font-size:15px}.choice.on{background:rgba(95,242,200,.16);box-shadow:inset 1px 1px 0 rgba(255,255,255,.4),0 0 0 2px rgba(95,242,200,.6)}

.tabs{display:flex;gap:6px;padding:4px;border-radius:999px;background:rgba(255,255,255,.06);box-shadow:inset 0 0 0 1px rgba(255,255,255,.1)}
.tab{height:38px;padding:0 16px;border-radius:999px;border:0;background:transparent;color:var(--mute);font-weight:700;font-size:14px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.tab.on{color:#fff;background:rgba(255,255,255,.16);box-shadow:inset 1px 1px 0 rgba(255,255,255,.45)}
.badge{min-width:20px;height:20px;padding:0 6px;border-radius:999px;background:#ff4d6d;color:#fff;font-size:12px;font-weight:800;display:inline-flex;align-items:center;justify-content:center}
.inbox{display:grid;grid-template-columns:340px 1fr;gap:16px;height:calc(100vh - 150px);min-height:460px}
.clist{overflow-y:auto;padding:8px}
.citem{display:flex;gap:10px;align-items:center;width:100%;padding:10px;border-radius:18px;border:0;background:transparent;color:#fff;text-align:left;cursor:pointer}
.citem:hover{background:rgba(255,255,255,.06)}.citem.on{background:rgba(255,255,255,.13)}
.citem .grow{flex:1;min-width:0}.citem.un b{color:#fff}.citem.un .prev{color:#fff;font-weight:600}
.dot{width:10px;height:10px;border-radius:50%;background:var(--mint);box-shadow:0 0 10px var(--mint);flex:none}
.av{width:44px;height:44px;border-radius:50%;flex:none;background:linear-gradient(135deg,#5b7cff,#9b6bff) center/cover;display:flex;align-items:center;justify-content:center;font-weight:800;position:relative}
.av.on::after{content:"";position:absolute;right:0;bottom:0;width:11px;height:11px;border-radius:50%;background:#3fdc8a;box-shadow:0 0 0 2px #0b1030}
.thread{display:flex;flex-direction:column;min-height:0}
.thead{padding:14px 16px;border-bottom:1px solid rgba(255,255,255,.08)}
.msgs{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:6px}
.b{max-width:72%;padding:9px 14px;border-radius:20px;font-size:15px;line-height:1.4;white-space:pre-wrap;word-wrap:break-word;background:rgba(255,255,255,.1);align-self:flex-start}
.b.me{align-self:flex-end;background:linear-gradient(135deg,var(--ac),var(--ac2))}
.kpis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px}
.kpi{padding:14px 16px;border-radius:22px;display:flex;flex-direction:column;gap:4px}.kpi b{font-size:30px;font-weight:800;letter-spacing:-.02em;display:flex;align-items:center;gap:8px}
.kpi .up{color:var(--mint);font-weight:700}.kpi .down{color:#ff9aa8;font-weight:700}.kpi.hot b{color:#ff9aa8}
.livedot{width:10px;height:10px;border-radius:50%;background:#3fdc8a;box-shadow:0 0 0 0 rgba(63,220,138,.6);animation:live 1.8s infinite;display:inline-block;flex:none}
@keyframes live{70%{box-shadow:0 0 0 8px rgba(63,220,138,0)}100%{box-shadow:0 0 0 0 rgba(63,220,138,0)}}
.chart{width:100%;height:auto;display:block;margin-top:6px}.chart .grid{stroke:rgba(255,255,255,.1)}.chart .ax{fill:rgba(220,228,255,.6);font-size:11px}.chart .barg:hover rect:first-child{filter:brightness(1.3)}
.eng{display:grid;grid-template-columns:1fr 1fr;gap:10px}.eng>div{display:flex;flex-direction:column;padding:10px 12px;border-radius:14px;background:rgba(255,255,255,.06)}.eng b{font-size:22px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.plist{display:flex;flex-direction:column;gap:8px}.prow{display:flex;align-items:center;gap:10px}
.replytog{display:flex;align-items:center;gap:6px}.replytog .tog{transform:scale(.85)}
@media (max-width:1000px){.kpis{grid-template-columns:repeat(3,minmax(0,1fr))}.grid3{grid-template-columns:1fr}}
@media (max-width:560px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.kpi b{font-size:24px}}
.b img{max-width:240px;border-radius:12px;display:block;margin:2px 0}
.b .t{display:block;font-size:11px;opacity:.6;margin-top:3px}.b.sys{align-self:center;background:none;color:var(--mute);font-size:13px}
.comp{display:flex;gap:8px;padding:12px;border-top:1px solid rgba(255,255,255,.08);align-items:flex-end}
.comp textarea{flex:1;resize:none;min-height:46px;max-height:140px;border-radius:22px;border:0;padding:12px 16px;font:inherit;font-size:15px;color:#fff;background:rgba(255,255,255,.08);box-shadow:inset 0 0 0 1px rgba(255,255,255,.12);outline:none}
.btn.sm{height:34px;padding:0 12px;font-size:13px}.btn.red{background:rgba(255,77,109,.25)}
.sets{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.sets section{display:flex;flex-direction:column;gap:12px}
.setrow{display:flex;justify-content:space-between;align-items:center;gap:12px}
.tog{width:52px;height:30px;border-radius:999px;border:0;background:rgba(255,255,255,.18);position:relative;cursor:pointer;flex:none}
.tog::after{content:"";position:absolute;left:3px;top:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .2s}
.tog.on{background:var(--mint)}.tog.on::after{transform:translateX(22px)}
.sw{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.swatch{height:64px;border-radius:16px;border:0;cursor:pointer;background-size:cover;background-position:center;box-shadow:inset 0 0 0 1px rgba(255,255,255,.2);color:#fff;font-weight:700;font-size:12px;display:flex;align-items:flex-end;padding:6px 8px}
.swatch.on{box-shadow:0 0 0 3px var(--mint)}
textarea.inp{height:auto;min-height:90px;padding:12px 16px;font:inherit;font-size:15px;resize:vertical}
.fixed{background:rgba(95,242,200,.12);border-radius:14px;padding:10px 12px;font-size:13px;line-height:1.5}
@media (max-width:820px){.inbox{grid-template-columns:1fr;height:auto}.inbox.open .clist{display:none}.inbox:not(.open) .thread{display:none}.thread{height:calc(100vh - 170px)}.sets{grid-template-columns:1fr}.b{max-width:85%}.tr{grid-template-columns:1.2fr 1fr 1.7fr .8fr .9fr 1.4fr}}
.tr{grid-template-columns:1.2fr 1fr 1.6fr .8fr .9fr 1.5fr}
</style></head>
<body><div class="wrap" id="app"><div class="gate glass card"><div class="row"><div class="logo"></div><div><h1>Nexa Owner</h1><div class="mute small">Loading…</div></div></div></div></div>
<script type="module">
import CONFIG from '../config.js';
const OWNER_EMAIL = 'etihadairways1028@gmail.com';
const V = '11.10.0', base = CONFIG.firebase?.sdkBase || `https://www.gstatic.com/firebasejs/${V}/`;
const [F, A] = await Promise.all([import(base + 'firebase-app.js'), import(base + 'firebase-auth.js')]);
const app = F.initializeApp(CONFIG.firebase, 'owner'); const auth = A.getAuth(app);
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const store = { get: k => { try { return localStorage.getItem(k); } catch { return null; } }, set: (k, v) => { try { v ? localStorage.setItem(k, v) : localStorage.removeItem(k); } catch {} } };
const S = { step: 'loading', err: '', okMsg: '', busy: false, session: store.get('nexa.owner.session') || '', data: null, q: '', sort: 'joined', tab: location.hash === '#inbox' ? 'messages' : 'overview', cid: '', drafts: {}, sound: store.get('nexa.owner.sound') !== '0', desk: store.get('nexa.owner.desk') === '1' };
const sessionStorage = { getItem: k => store.get(k), setItem: (k, v) => store.set(k, v), removeItem: k => store.set(k, '') };
const fn = CONFIG.ownerEndpoint || '/.netlify/functions/owner';
async function api(action, extra = {}) {
  const tok = await auth.currentUser.getIdToken();
  const r = await fetch(fn, { method: 'POST', headers: { authorization: 'Bearer ' + tok, 'content-type': 'application/json' }, body: JSON.stringify({ action, session: S.session, ...extra }) });
  const j = await r.json().catch(() => ({ error: 'Server error' })); if (!r.ok) { const e = new Error(j.message || j.error || 'Something went wrong'); e.code = j.error; throw e; }
  if (j.session && S.session) { S.session = j.session; store.set('nexa.owner.session', j.session); }
  return j;
}
const head = (t, sub, n) => `<div class="row"><div class="logo"></div><div><h1>${t}</h1><div class="mute small">${sub}</div></div></div>${n ? `<div class="steps">${[1, 2, 3].map(i => `<i class="${i <= n ? 'on' : ''}"></i>`).join('')}</div>` : ''}`;
const msg = () => (S.err ? `<div class="err">${esc(S.err)}</div>` : '') + (S.okMsg ? `<div class="ok">${esc(S.okMsg)}</div>` : '');
function render() {
  const el = $('#app');
  if (S.step === 'loading') { el.innerHTML = `<div class="gate glass card">${head('Nexa Owner', 'Loading…')}</div>`; return; }
  if (S.step === 'signin') { el.innerHTML = `<form class="gate glass card" id="f-signin">${head('Nexa Owner', 'Step 1 of 3 · Sign in', 1)}<label>Email<input class="inp" value="${OWNER_EMAIL}" disabled></label><label>Password<input class="inp" id="pw" type="password" autocomplete="current-password" required autofocus></label>${msg()}<button class="btn pri" ${S.busy ? 'disabled' : ''}>${S.busy ? 'Signing in…' : 'Continue'}</button><a class="small mute" href="#" id="forgot">Forgot password?</a></form>`; return; }
  if (S.step === 'verify') { el.innerHTML = `<div class="gate glass card">${head('One-time check', 'Prove this account is yours', 1)}<div class="mute small" style="line-height:1.6">Copy your account ID below and save it in Netlify, so only this account can ever open the owner page:</div><div class="row" style="gap:8px"><input class="inp" id="uidbox" readonly value="${esc(S.uid || '')}" style="font-size:14px"><button class="btn" id="copyuid">Copy</button></div><ol class="mute small" style="padding-left:18px;line-height:1.8"><li>Netlify → your site → <b>Site configuration → Environment variables</b></li><li><b>Add a variable</b> → Key: <b>OWNER_UID</b> → Value: paste the ID → Create</li><li><b>Deploys → Trigger deploy → Deploy site</b>, wait ~1 minute</li><li>Come back and tap <b>Done</b></li></ol>${msg()}<div class="row wrapflex"><button class="btn pri" id="vdone">Done</button><button class="btn" id="vsend">Or verify by email</button><button class="btn" id="out">Sign out</button></div></div>`; return; }
  if (S.step === 'setup') { const mth = S.method || 'nexa'; el.innerHTML = `<form class="gate glass card" id="f-setup">${head('Set up your locks', 'First time only · Step 2 of 3', 2)}<div class="mute small">Choose an owner PIN (6–12 numbers). You'll need it every time you open this page.</div><label>New owner PIN<input class="inp code" id="pin1" inputmode="numeric" pattern="[0-9]*" type="password" minlength="6" maxlength="12" required autofocus></label><label>Type it again<input class="inp code" id="pin2" inputmode="numeric" pattern="[0-9]*" type="password" minlength="6" maxlength="12" required></label>
      <div style="font-weight:700;font-size:14px">How should we send your verification code?</div>
      <div class="choices">${[['nexa', '📱 To my @shiv account in Nexa', 'A notification on your phone. Nothing else to set up.'], ['email', '✉️ To my email', S.emailReady ? 'Sent to ' + OWNER_EMAIL : 'Needs a free Resend key in Netlify first (see below).'], ['totp', '🔐 Google Authenticator', 'Codes from the Google Authenticator app.']].map(([k, t, d]) => `<button type="button" class="choice ${mth === k ? 'on' : ''}" data-method="${k}"><b>${t}</b><span class="mute small">${d}</span></button>`).join('')}</div>
      ${mth === 'email' && !S.emailReady ? `<ol class="mute small" style="padding-left:18px;line-height:1.7"><li>Go to <b>resend.com</b> and sign up with <b>${OWNER_EMAIL}</b></li><li><b>API Keys → Create API key</b> → copy it</li><li>Netlify → <b>Environment variables</b> → add <b>RESEND_API_KEY</b> = the key → Deploys → <b>Trigger deploy</b></li></ol>` : ''}
      ${S.oldServer ? `<div class="err" style="line-height:1.55">⚠️ Netlify is still running the <b>old</b> owner server, so code-by-message can't work yet. On GitHub open <b>nexa/nexa/netlify/functions</b> and upload the new <b>owner.mjs</b> from the zip (replace it), commit, wait for Netlify to say <b>Published</b>, then refresh this page.</div>` : ''}
      ${msg()}<button class="btn pri" ${S.busy ? 'disabled' : ''}>Next</button></form>`; return; }
  if (S.step === 'scan') { el.innerHTML = `<form class="gate glass card" id="f-confirm">${head('Turn on 2-step verification', 'First time only · Step 3 of 3', 3)}<ol class="mute small" style="padding-left:18px;line-height:1.7"><li>Install <b>Google Authenticator</b> on your phone.</li><li>Tap <b>+</b> → <b>Scan a QR code</b> and scan this:</li></ol><div class="qr">${S.qr || ''}</div><div class="mute small" style="text-align:center">Can't scan? Tap <b>Enter a setup key</b> and type:<br><b style="letter-spacing:.08em;word-break:break-all">${esc(S.secret || '')}</b></div><label>Type the 6-digit code it shows<input class="inp code" id="c1" inputmode="numeric" maxlength="6" autocomplete="one-time-code" required autofocus></label>${msg()}<button class="btn pri" ${S.busy ? 'disabled' : ''}>Turn it on</button></form>`; return; }
  if (S.step === 'unlock') { const tot = S.method === 'totp'; el.innerHTML = `<form class="gate glass card" id="f-unlock">${head('Unlock', tot ? 'PIN + Google Authenticator code' : 'PIN + verification code', 3)}<label>Owner PIN<input class="inp code" id="pin" inputmode="numeric" type="password" maxlength="12" required autofocus value="${esc(S.pinDraft || '')}"></label>${tot ? '' : `<div class="row spread wrapflex"><span class="mute small">${S.sentTo ? 'Code sent to <b>' + esc(S.sentTo) + '</b>' : 'We\'ll send a 6-digit code to ' + (S.method === 'email' ? 'your email' : 'your @shiv account in Nexa')}</span><button type="button" class="btn" id="sendcode" ${S.sending ? 'disabled' : ''}>${S.sending ? 'Sending…' : S.sentTo ? 'Send again' : 'Send code'}</button></div>`}<label>${tot ? '6-digit code from Google Authenticator' : '6-digit verification code'}<input class="inp code" id="code" inputmode="numeric" maxlength="6" autocomplete="one-time-code" required></label>${msg()}<button class="btn pri" ${S.busy ? 'disabled' : ''}>${S.busy ? 'Checking…' : 'Unlock'}</button><button type="button" class="btn" id="out">Sign out</button></form>`; return; }
  if (S.step === 'dash') { el.innerHTML = dash(); return; }
}

    <div class="setrow"><span><b>Sign out everywhere</b><div class="mute small">Locks this page on every device, including this one.</div></span><button class="btn sm red" id="logoutAll">Sign out all</button></div>

async function loadData() {

  catch (e) { if (e.code === 'session') return lockOut(e.message); S.err = e.message; }
  render();
}
function lockOut(m) { S.session = ''; sessionStorage.removeItem('nexa.owner.session'); S.step = 'unlock'; S.err = m || ''; S.inbox = null; S.thread = null; render(); }
let lastSeenAt = +(localStorage.getItem('nexa.owner.seenAt') || 0);
async function loadInbox() {

    const r = await api('inbox'); const old = S.inbox;
    S.inbox = r;
    const fresh = r.list.filter(c => c.unread && c.last.at > lastSeenAt);

    if (fresh.length) { lastSeenAt = Math.max(...fresh.map(c => c.last.at)); localStorage.setItem('nexa.owner.seenAt', lastSeenAt); }
    document.title = (r.unread ? `(${r.unread}) ` : '') + 'Nexa Owner';

    renderKeep();

async function loadThread() {

  try { const r = await api('thread', { cid }); if (S.cid !== cid) return; const prevLen = S.thread?.cid === cid ? S.thread.msgs.length : -1; S.thread = { cid, msgs: r.msgs, typing: r.typing, at: Math.max(0, ...r.msgs.map(m => m.at)) }; const c = S.inbox?.list.find(x => x.id === cid); if (c && c.unread) { c.unread = false; S.inbox.unread = Math.max(0, S.inbox.unread - 1); document.title = (S.inbox.unread ? `(${S.inbox.unread}) ` : '') + 'Nexa Owner'; } renderKeep(prevLen !== r.msgs.length); }
  catch (e) { if (e.code === 'session') lockOut(e.message); }
}
// re-render without losing what you're typing
function renderKeep(scroll) {
  if (S.step !== 'dash') return;
  const ta = $('#rtext'); if (ta && S.cid) S.drafts[S.cid] = ta.value; const had = document.activeElement === ta; const pos = ta?.selectionStart;
  const ms = $('#msgs'); const atBottom = !ms || ms.scrollHeight - ms.scrollTop - ms.clientHeight < 80;
  const qEl = $('#q'), qFocus = document.activeElement === qEl;
  const keepIds = ['autoReply', 'annTitle', 'annText', 'op', 'np1', 'np2', 'tc'].map(id => [id, $('#' + id)?.value]);
  render();
  keepIds.forEach(([id, v]) => { const el = $('#' + id); if (el && v != null) el.value = v; });
  const t2 = $('#rtext'); if (t2 && had) { t2.focus(); t2.setSelectionRange(pos, pos); }
  if (qFocus) { const q = $('#q'); q?.focus(); q?.setSelectionRange(q.value.length, q.value.length); }
  const m2 = $('#msgs'); if (m2 && (scroll ? atBottom : true) && (atBottom || scroll === 'force')) m2.scrollTop = m2.scrollHeight;

function ping() { if (!S.sound) return; try { const ac = new (window.AudioContext || window.webkitAudioContext)(); [880, 1320].forEach((f, i) => { const o = ac.createOscillator(), g = ac.createGain(); o.frequency.value = f; o.connect(g); g.connect(ac.destination); const t = ac.currentTime + i * .12; g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(.2, t + .02); g.gain.exponentialRampToValueAtTime(.0001, t + .25); o.start(t); o.stop(t + .3); }); } catch {} }
function alertNew(c) {
  ping();
  const looking = document.visibilityState === 'visible' && S.tab === 'messages' && S.cid === c.id;
  if (!looking && S.desk && 'Notification' in window && Notification.permission === 'granted') {
    try { const n = new Notification('🛟 ' + c.name + ' needs you', { body: c.last.text, icon: '../icon-192-v3.png', tag: 'owner_' + c.id }); n.onclick = () => { window.focus(); S.tab = 'messages'; S.cid = c.id; S.thread = null; render(); loadThread(); n.close(); }; } catch {}
  }
  if (!looking) { S.flash = `🛟 New message from <b>${esc(c.name)}</b> — <a href="#" data-open="${c.id}" style="color:var(--mint)">open</a>`; clearTimeout(S.flashT); S.flashT = setTimeout(() => { S.flash = ''; renderKeep(); }, 8000); }
}
function resizeImg(file, max = 1600) { return new Promise((res, rej) => { const img = new Image(); img.onload = () => { const k = Math.min(1, max / Math.max(img.width, img.height)); const c = document.createElement('canvas'); c.width = img.width * k; c.height = img.height * k; c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); let q = .82, out = c.toDataURL('image/jpeg', q); while (out.length > 900000 && q > .4) { q -= .1; out = c.toDataURL('image/jpeg', q); } res(out); }; img.onerror = rej; img.src = URL.createObjectURL(file); }); }
async function savePrefs(p) { try { const r = await api('prefs', { prefs: p }); S.ui = r.ui; applyBg(); renderKeep(); } catch (e) { alert(e.message); } }

async function route() {
  const u = auth.currentUser;
  if (!u) { S.step = 'signin'; return render(); }
  if ((u.email || '').toLowerCase() !== OWNER_EMAIL) { await A.signOut(auth); S.step = 'signin'; S.err = 'This page is only for the owner of Nexa.'; return render(); }
  try { const st = await api('status'); S.oldServer = !st.version; S.serverV = st.version || 0; S.method = st.method || S.method; S.emailReady = st.emailReady; if (!st.setup) { S.step = 'setup'; return render(); } if (S.session) { S.step = 'dash'; render(); return loadData(); } S.step = 'unlock'; render(); }
  catch (e) { if (e.code === 'verify-email') { S.uid = u.uid; S.err = ''; S.step = 'verify'; return render(); } S.err = e.message; S.step = 'signin'; render(); }
}

document.addEventListener('submit', async e => {

    if (id === 'f-setup') { const p1 = v.pin1, p2 = v.pin2; if (p1 !== p2) throw new Error('The two PINs don\'t match.'); if (!/^\d{6,12}$/.test(p1)) throw new Error('Use 6 to 12 numbers.'); if (S.oldServer && (S.method || 'nexa') !== 'totp') throw new Error('OLD_SERVER'); const r = await api('setup', { pin: p1, method: S.method || 'nexa' }); if (r.ok) { S.method = r.method; S.step = 'unlock'; S.okMsg = 'All set! Tap Send code to get your first code.'; S.busy = false; render(); return; } S.secret = r.secret; const Q = (await import('../qr.js')).default; const q = Q(0, 'M'); q.addData(r.otpauth); q.make(); S.qr = q.createSvgTag({ cellSize: 5, margin: 2, scalable: true }); S.step = 'scan'; }

document.addEventListener('click', async e => {
  const t = e.target.closest('button,a,[data-sort]'); if (!t) return;
  if (t.closest('label') && t.tagName !== 'BUTTON') return;
  if (t.dataset.tab) { S.tab = t.dataset.tab; S.flash = ''; history.replaceState(null, '', t.dataset.tab === 'messages' ? '#inbox' : '#'); render(); if (S.tab === 'messages') { loadInbox(); if (S.cid) loadThread(); } return; }
  if (t.dataset.cid) { if (S.cid && $('#rtext')) S.drafts[S.cid] = $('#rtext').value; S.cid = t.dataset.cid; S.thread = null; render(); loadThread(); setTimeout(() => $('#rtext')?.focus(), 50); return; }
  if (t.dataset.open) { e.preventDefault(); S.tab = 'messages'; S.cid = t.dataset.open; S.thread = null; S.flash = ''; render(); loadThread(); return; }
  if (t.id === 'back') { S.cid = ''; S.thread = null; render(); return; }
  if (t.id === 'tReply') { const c = S.inbox.list.find(x => x.id === S.cid); if (!c) return; const allow = !!c.readOnly; try { await api('setReply', { cid: S.cid, allow }); c.readOnly = !allow; S.flash = allow ? '✅ They can reply in this chat.' : '🔒 Official-only: they can read but not reply.'; renderKeep(); } catch (er) { alert(er.message); } return; }

  if (t.dataset.ban) { const reason = prompt(`Ban ${t.dataset.name || 'this person'}? They won't be able to message, add friends, post events or moments.\n\nReason (optional, they'll see it):`, ''); if (reason === null) return; try { await api('ban', { uid: t.dataset.ban, reason }); S.data.bans = [...(S.data.bans || []), { id: t.dataset.ban, at: Date.now(), reason }]; S.flash = '🚫 ' + esc(t.dataset.name || 'User') + ' is banned.'; renderKeep(); } catch (er) { alert(er.message); } return; }
  if (t.dataset.unban) { if (!confirm(`Unban ${t.dataset.name || 'this person'}?`)) return; try { await api('unban', { uid: t.dataset.unban }); S.data.bans = (S.data.bans || []).filter(b => b.id !== t.dataset.unban); S.flash = '✅ ' + esc(t.dataset.name || 'User') + ' is unbanned.'; renderKeep(); } catch (er) { alert(er.message); } return; }

  if (t.dataset.setmethod) { const m = t.dataset.setmethod; if (m === S.method && !S.newTotp) return; try { const r = await api('setMethod', { method: m }); if (r.secret) { const Q = (await import('../qr.js')).default; const q = Q(0, 'M'); q.addData(r.otpauth); q.make(); S.newTotp = { secret: r.secret, qr: q.createSvgTag({ cellSize: 5, margin: 2, scalable: true }) }; } else { S.method = r.method; S.newTotp = null; S.flash = '✅ Codes will now go to ' + (r.method === 'email' ? 'your email' : 'your @shiv account in Nexa') + '.'; } renderKeep(); } catch (er) { alert(er.message); } return; }
  if (t.id === 'installOwner' && S.installEvt) { S.installEvt.prompt(); await S.installEvt.userChoice.catch(() => {}); S.installEvt = null; renderKeep(); return; }
  if (t.id === 'logoutAll') { if (!confirm('Sign out of the owner page on every device?')) return; try { await api('logoutAll'); } catch {} lockOut('Signed out everywhere. Unlock again to continue.'); return; }

  if (t.id === 'refresh') { t.textContent = 'Refreshing…'; loadData(); if (S.cid) loadThread(); }

});
