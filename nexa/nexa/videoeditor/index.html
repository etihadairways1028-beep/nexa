<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Nexa Studio</title>
<meta name="description" content="Nexa Studio: where the Nexa designers and video creators make videos, plan posts and share designs.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#09090F">
<link rel="icon" href="/favicon-v4.png">
<style>
/* video editor */
.ve-stk{display:flex;gap:3px;flex-wrap:wrap;margin:2px 0 4px}.ve-stk button{width:26px;height:26px;border-radius:8px;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.05);cursor:pointer;font-size:14px;padding:0;line-height:1}.ve-stk button.on{background:rgba(140,151,255,.45);border-color:#fff}
.ve-ai{display:flex;gap:10px;align-items:center;padding:10px 10px 10px 12px;border-radius:999px;margin-bottom:14px}.ve-ai .k-in{flex:1;border-radius:999px}
.ve{display:grid;grid-template-columns:300px minmax(0,1fr) 300px;gap:14px;align-items:start}
.ve-col{padding:14px;display:flex;flex-direction:column;gap:10px}
.ve-stage{padding:14px;display:flex;flex-direction:column;align-items:center;gap:12px;position:sticky;top:64px}
.ve-canvaswrap{position:relative;width:100%;display:grid;place-items:center;background:repeating-conic-gradient(rgba(255,255,255,.03) 0 25%,transparent 0 50%) 0 0/22px 22px;border-radius:16px;padding:10px}
.ve-canvaswrap canvas{max-width:100%;max-height:58vh;border-radius:12px;box-shadow:0 20px 50px -20px rgba(0,0,0,.8);background:#000;display:block}
.ve-ctrl{display:flex;align-items:center;gap:10px;width:100%}
.ve-playb{width:48px;height:48px;border-radius:50%;border:0;background:#F3F1EC;color:#0B0B12;display:grid;place-items:center;cursor:pointer;flex:none}
.ve-time{font:600 13px ui-monospace,Menlo,monospace;color:var(--mute);white-space:nowrap}
input[type=range]{width:100%;accent-color:#9AA2FF}
.ve-strip{display:flex;gap:4px;width:100%;height:30px}
.ve-strip span{border-radius:8px;background:linear-gradient(135deg,rgba(140,151,255,.45),rgba(255,143,177,.35));border:1px solid rgba(255,255,255,.2);overflow:hidden;font-size:11px;padding:6px 6px;white-space:nowrap;text-overflow:ellipsis;cursor:pointer;min-width:6px}
.ve-strip span.brand{background:rgba(255,255,255,.12)}.ve-strip span.on{outline:2px solid #fff}
.ve-clip{display:flex;gap:10px;padding:8px;border-radius:14px;background:rgba(255,255,255,.05);border:1px solid var(--line)}
.ve-clip img{width:56px;height:56px;border-radius:10px;object-fit:cover;flex:none;background:#000}
.ve-clip .nm{font-weight:700;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ve-clip .tr{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--mute)}
.ve-mini{width:30px;height:30px;border-radius:9px;border:1px solid var(--line2);background:rgba(255,255,255,.06);display:grid;place-items:center;cursor:pointer;flex:none}
.ve-h{font-weight:800;font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--mute);margin-top:4px;display:flex;align-items:center;gap:8px}
.ve-seg{display:flex;gap:4px;flex-wrap:wrap}.ve-seg button{height:34px;padding:0 11px;border-radius:10px;border:1px solid var(--line2);background:rgba(255,255,255,.05);cursor:pointer;font-size:13px;font-weight:600}.ve-seg button.on{background:#F3F1EC;color:#0B0B12}
.ve-tog{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:14px;padding:4px 0;cursor:pointer}
.ve-tog input[type=checkbox]{width:40px;height:24px;appearance:none;border-radius:99px;background:rgba(255,255,255,.18);position:relative;cursor:pointer;transition:.2s;flex:none}
.ve-tog input[type=checkbox]::after{content:"";position:absolute;left:3px;top:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:.2s}.ve-tog input[type=checkbox]:checked{background:#8C97FF}.ve-tog input[type=checkbox]:checked::after{left:19px}
.ve-drop{border:1.5px dashed rgba(255,255,255,.25);border-radius:16px;padding:18px;text-align:center;color:var(--mute);font-size:14px}
.ve-colors{display:flex;gap:6px}.ve-colors button{width:28px;height:28px;border-radius:50%;border:2px solid rgba(255,255,255,.3);cursor:pointer}.ve-colors button.on{border-color:#fff;box-shadow:0 0 0 2px #8C97FF}
.ve-rec{position:absolute;inset:10px;border-radius:12px;display:grid;place-items:center;background:rgba(0,0,0,.55);font-weight:700;text-align:center}
/* plan */
.cal{padding:14px}.cal-g{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal-d{min-height:92px;border-radius:14px;padding:6px;background:rgba(255,255,255,.04);border:1px solid var(--line);cursor:pointer;display:flex;flex-direction:column;gap:3px;min-width:0}
.cal-d.out{opacity:.35}.cal-d.today{border-color:#9AA2FF;box-shadow:inset 0 0 0 1px #9AA2FF}
.cal-d>b{font-size:12.5px;color:var(--mute)}.cal-wk{font-size:12px;color:var(--mute);text-align:center;font-weight:700}
.chip{display:block;font-size:11.5px;font-weight:700;padding:3px 7px;border-radius:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border:0;text-align:left;cursor:pointer;color:#0B0B12}
.st-idea{background:#C9C7D2}.st-making{background:#7FB2FF}.st-review{background:#FFD27A}.st-changes{background:#FF9DA8}.st-approved{background:#7BF0B8}.st-published{background:#B794FF}
.board{display:grid;grid-template-columns:repeat(6,minmax(200px,1fr));gap:12px;overflow-x:auto;padding-bottom:8px}
.col{padding:10px;display:flex;flex-direction:column;gap:8px;min-height:140px}
.col-h{display:flex;align-items:center;gap:8px;font-weight:800;font-size:13.5px;padding:2px 4px}.col-h i{width:10px;height:10px;border-radius:50%}
.pcard{padding:10px;border-radius:14px;background:rgba(255,255,255,.07);border:1px solid var(--line);cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:6px;transition:transform .15s}.pcard:hover{transform:translateY(-2px)}
.pcard img{width:100%;aspect-ratio:16/10;object-fit:cover;border-radius:10px}
.plats{display:flex;gap:4px;flex-wrap:wrap}.plat{font-size:11px;font-weight:700;padding:2px 7px;border-radius:99px;background:rgba(255,255,255,.1)}
.plat-t{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 12px;border-radius:99px;border:1px solid var(--line2);background:rgba(255,255,255,.05);cursor:pointer;font-weight:600;font-size:13px}.plat-t.on{background:#F3F1EC;color:#0B0B12}
.next{display:flex;gap:12px;align-items:center;padding:10px;border-radius:14px;background:rgba(255,255,255,.05);cursor:pointer;border:0;width:100%;text-align:left}
.next .dt{width:48px;text-align:center;flex:none}.next .dt b{display:block;font-size:22px;line-height:1}
@media (max-width:1180px){.ve{grid-template-columns:minmax(0,1fr) 300px}.ve-left{grid-column:1/-1;order:3}}
@media (max-width:860px){.ve{grid-template-columns:1fr}.ve-stage{position:static;order:0}.ve-left{order:1}.ve>section:last-child{order:2}.ve-canvaswrap canvas{max-height:46vh}.cal-d{min-height:62px}.chip{font-size:10px;padding:2px 4px}.board{grid-template-columns:repeat(6,78vw)}}
</style>
</head>
<body>
<div id="app"></div>
<script type="module">
import { boot, S, api, esc, icon, toast, ago, size, avatar, render, reload, openModal, closeModal, askAI, uploadFile, getBlob, makeThumb, download, pickFile, vComments, sessionTok } from '/team/kit.js';

const ST = [['idea', 'Ideas'], ['making', 'Making'], ['review', 'Waiting for owner'], ['changes', 'Needs changes'], ['approved', 'Approved'], ['published', 'Published']];
const STN = Object.fromEntries(ST);
const PLATS = ['TikTok', 'YouTube', 'Instagram', 'Nexa', 'X'];
const fileById = id => (S.data.file || []).find(f => f.id === id);
const dkey = d => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');

// ================= HOME
function vHome() {
  const D = S.data, P = D.post || [], today = dkey(new Date());
  const up = P.filter(p => p.date && p.date >= today && p.status !== 'published').sort((a, b) => a.date.localeCompare(b.date)).slice(0, 5);
  const news = P.filter(p => (p.comments || []).some(c => c.owner)).sort((a, b) => (b.decidedAt || 0) - (a.decidedAt || 0)).slice(0, 4);
  const mo = today.slice(0, 7);
  return `<div class="k-head"><div><h1 class="k-h1">Hi ${esc(D.me.name)} 👋</h1><p class="mute">Make videos, plan posts and share designs for Nexa.</p></div>
    <div class="k-row"><button class="k-btn pri" data-a="tab" data-v="editor">${icon('film', 18)} Make a video</button><button class="k-btn" data-a="newPost">${icon('plus', 18)} Plan a post</button></div></div>
  <div class="k-cards" style="margin-bottom:16px">
    ${[['Waiting for owner', P.filter(p => p.status === 'review').length, '#FFD27A'], ['Approved to post', P.filter(p => p.status === 'approved').length, '#7BF0B8'], ['Published this month', P.filter(p => p.status === 'published' && (p.date || '').startsWith(mo)).length, '#B794FF'], ['Files', (D.file || []).filter(f => f.ready).length, '#7FB2FF']].map(([l, n, c]) => `<div class="glass k-card k-stat"><span class="mute small" style="display:flex;align-items:center;gap:8px"><i style="width:9px;height:9px;border-radius:50%;background:${c}"></i>${l}</span><b>${n}</b></div>`).join('')}
  </div>
  <div class="k-cards" style="grid-template-columns:repeat(auto-fit,minmax(300px,1fr))">
    <section class="glass k-card"><h3 style="margin:0 0 10px">Coming up</h3>${up.length ? up.map(p => { const d = new Date(p.date + 'T12:00'); return `<button class="next" data-a="openPost" data-v="${p.id}"><span class="dt"><span class="mute small">${d.toLocaleDateString([], { month: 'short' })}</span><b>${d.getDate()}</b></span><span style="min-width:0"><b>${esc(p.title)}</b><div class="mute small">${esc(STN[p.status])}${p.platforms?.length ? ' · ' + p.platforms.join(', ') : ''}</div></span></button>`; }).join('') : '<div class="mute">Nothing planned yet. <a href="#" data-a="newPost">Plan a post</a></div>'}</section>
    <section class="glass k-card"><h3 style="margin:0 0 10px">From the owner</h3>${news.length ? news.map(p => { const c = [...p.comments].reverse().find(c => c.owner); return `<button class="next" data-a="openPost" data-v="${p.id}"><span class="chip st-${p.status}" style="flex:none">${esc(STN[p.status])}</span><span style="min-width:0"><b>${esc(p.title)}</b><div class="mute small">“${esc(c.text)}” · ${ago(c.at)}</div></span></button>`; }).join('') : '<div class="mute">When the owner approves a post or asks for changes, it shows here.</div>'}</section>
    <section class="glass k-card"><h3 style="margin:0 0 10px">How it works</h3><ol class="mute" style="margin:0;padding-left:20px;line-height:1.8"><li>Make a video in the <b>Video editor</b>, or upload a design</li><li>Plan a post and press <b>Send to owner</b></li><li>The owner approves it (or asks for changes)</li><li>Post it, then press <b>Mark as published</b></li></ol></section>
  </div>`;
}

// ================= PLAN
function vPlan() {
  const P = S.data.post || [], off = S.mo || 0, base = new Date(); base.setDate(1); base.setMonth(base.getMonth() + off);
  const first = new Date(base); first.setDate(1 - ((base.getDay() + 6) % 7)); const today = dkey(new Date());
  const days = Array.from({ length: 42 }, (_, i) => { const d = new Date(first); d.setDate(first.getDate() + i); return d; });
  const byDay = {}; P.forEach(p => { if (p.date) (byDay[p.date] = byDay[p.date] || []).push(p); });
  return `<div class="k-head"><div><h1 class="k-h1">Plan & publish</h1><p class="mute">Plan posts, send them to the owner, then post them.</p></div><button class="k-btn pri" data-a="newPost">${icon('plus', 18)} New post</button></div>
  <section class="glass cal" style="margin-bottom:16px"><div class="k-row" style="justify-content:space-between;margin-bottom:10px"><b style="font-size:18px">${base.toLocaleDateString([], { month: 'long', year: 'numeric' })}</b><div class="k-row"><button class="k-btn sm" data-a="mo" data-v="-1">‹</button><button class="k-btn sm" data-a="mo" data-v="0">Today</button><button class="k-btn sm" data-a="mo" data-v="1">›</button></div></div>
    <div class="cal-g">${['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'].map(d => `<div class="cal-wk">${d}</div>`).join('')}
    ${days.map(d => { const k = dkey(d), L = byDay[k] || []; return `<div class="cal-d ${d.getMonth() !== base.getMonth() ? 'out' : ''} ${k === today ? 'today' : ''}" data-a="newPost" data-date="${k}"><b>${d.getDate()}</b>${L.slice(0, 3).map(p => `<button class="chip st-${p.status}" data-a="openPost" data-v="${p.id}" title="${esc(p.title)}">${esc(p.title)}</button>`).join('')}${L.length > 3 ? `<span class="mute small">+${L.length - 3}</span>` : ''}</div>`; }).join('')}</div></section>
  <div class="board">${ST.map(([k, l]) => { const L = P.filter(p => p.status === k); return `<section class="glass col"><div class="col-h"><i class="st-${k}"></i>${l} <span class="mute">${L.length}</span></div>${L.map(p => { const f = p.fileId && fileById(p.fileId); return `<button class="pcard" data-a="openPost" data-v="${p.id}">${f?.thumb ? `<img src="${esc(f.thumb)}" alt="">` : ''}<b>${esc(p.title)}</b>${p.date ? `<span class="mute small">${new Date(p.date + 'T12:00').toLocaleDateString([], { day: 'numeric', month: 'short' })}</span>` : ''}${p.platforms?.length ? `<span class="plats">${p.platforms.map(x => `<span class="plat">${esc(x)}</span>`).join('')}</span>` : ''}${(p.comments || []).length ? `<span class="mute small">💬 ${p.comments.length}</span>` : ''}</button>`; }).join('') || '<span class="mute small" style="padding:4px">Nothing here</span>'}</section>`; }).join('')}</div>`;
}
function postModal(p) {
  const isNew = !p.id; let plats = new Set(p.platforms || []);
  const media = (S.data.file || []).filter(f => f.ready && /^(video|image)\//.test(f.type));
  openModal(() => { const cur = isNew ? p : (S.data.post || []).find(x => x.id === p.id) || p; const f = cur.fileId && fileById(cur.fileId);
    return `<div class="k-mhead"><b>${isNew ? 'New post' : esc(cur.title)}</b><button class="k-x" data-a="close">${icon('x', 18)}</button></div>
    ${!isNew ? `<span class="chip st-${cur.status}" style="display:inline-block">${esc(STN[cur.status])}</span>` : ''}
    <form id="f-post" data-id="${cur.id || ''}">
      <label class="k-lab">Title</label><input class="k-in" name="title" value="${esc(cur.title || '')}" maxlength="140" placeholder="e.g. Nexa 1.8 launch reel" required>
      <label class="k-lab" style="display:flex;justify-content:space-between">Caption <a href="#" data-a="aiCaption">✨ Write it with AI</a></label><textarea class="k-in" name="text" maxlength="4000" placeholder="What the post says, with #hashtags">${esc(cur.text || '')}</textarea>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px"><div><label class="k-lab">Post date</label><input class="k-in" type="date" name="date" value="${esc(cur.date || '')}"></div>
      <div><label class="k-lab">Video or design</label><select class="k-in k-sel" name="fileId"><option value="">None</option>${media.map(m => `<option value="${m.id}" ${m.id === cur.fileId ? 'selected' : ''}>${esc(m.name)}</option>`).join('')}</select></div></div>
      ${f?.thumb ? `<img src="${esc(f.thumb)}" alt="" style="width:100%;max-height:220px;object-fit:cover;border-radius:14px;margin-top:10px">` : ''}
      <label class="k-lab">Where</label><div class="k-row" id="plats">${PLATS.map(x => `<button type="button" class="plat-t ${plats.has(x) ? 'on' : ''}" data-a="plat" data-v="${x}">${esc(x)}</button>`).join('')}</div>
      <div class="k-row" style="margin-top:16px">
        <button class="k-btn pri" name="go" value="save">${isNew ? 'Save idea' : 'Save'}</button>
        ${['idea', 'making', 'changes'].includes(cur.status || 'idea') ? `<button class="k-btn ai" name="go" value="review">${icon('send', 16)} Send to owner</button>` : ''}
        ${cur.status === 'approved' ? `<button class="k-btn ai" name="go" value="published">${icon('check', 16)} Mark as published</button>` : ''}
        ${cur.status === 'review' ? '<span class="mute small">Waiting for the owner to approve</span>' : ''}
        ${!isNew ? `<button type="button" class="k-btn danger" data-a="delPost" data-v="${cur.id}" style="margin-left:auto">${icon('trash', 16)}</button>` : ''}
      </div></form>${isNew ? '' : vComments(cur, 'post')}`; });
  S.plats = plats;
}

// ================= VIDEO EDITOR
const E = { beat: 'none', bvol: .55, trans: 'zoom', clips: [], aspect: '9:16', fit: 'cover', filter: 'none', imgDur: 3, text: { t: '', sub: '', pos: 'bottom', style: 'glass', color: '#FFFFFF', size: 1, secs: 0 }, brand: { mark: true, intro: false, outro: true }, music: null, vol: 1, mvol: .5, t: 0, playing: false, rec: null };
const RES = { '9:16': [720, 1280], '16:9': [1280, 720], '1:1': [960, 960], '4:5': [864, 1080] };
let cv, cx, actx, mixDest, rafId = 0, segIdx = -1, lastWall = 0, uid = 0;
const segs = () => { const L = []; let t = 0; const add = (kind, dur, clip) => { L.push({ kind, dur, clip, start: t }); t += dur; };
  if (E.brand.intro) add('intro', 2); E.clips.forEach(c => add(c.kind, c.kind === 'video' ? Math.max(.2, c.b - c.a) : c.dur, c)); if (E.brand.outro && E.clips.length) add('outro', 2.5); return L; };
const total = () => segs().reduce((a, s) => a + s.dur, 0);
const segAt = t => { const L = segs(); for (let i = 0; i < L.length; i++) if (t < L[i].start + L[i].dur || i === L.length - 1) return [L[i], i, L]; return [null, -1, L]; };
const fmt = t => Math.floor(t / 60) + ':' + String(Math.floor(t % 60)).padStart(2, '0') + '.' + Math.floor((t % 1) * 10);

function ensureAudio() {
  if (actx) return; const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
  actx = new AC(); mixDest = actx.createMediaStreamDestination();
  E.clips.forEach(wire); if (E.music) wire(E.music);
}
function wire(c) { if (!actx || !c.el || c.node || c.kind === 'image') return; try { c.node = actx.createMediaElementSource(c.el); c.gain = actx.createGain(); c.node.connect(c.gain); c.gain.connect(actx.destination); c.gain.connect(mixDest); setVol(); } catch (e) { } }
function setVol() { E.clips.forEach(c => { if (c.gain) c.gain.gain.value = c.mute ? 0 : E.vol; else if (c.el) { c.el.volume = Math.min(1, E.vol); c.el.muted = !!c.mute; } }); if (E.music) { if (E.music.gain) E.music.gain.gain.value = E.mvol; else if (E.music.el) E.music.el.volume = E.mvol; } }

async function addMedia(file, fromId) {
  const url = URL.createObjectURL(file), kind = /^video\//.test(file.type) ? 'video' : /^image\//.test(file.type) ? 'image' : /^audio\//.test(file.type) ? 'audio' : '';
  if (!kind) return toast('That isn’t a video, picture or song.');
  if (kind === 'audio') { const el = new Audio(url); el.loop = true; el.preload = 'auto'; E.music = { kind: 'audio', el, name: file.name, url }; wire(E.music); setVol(); paintSide(); return toast('Music added'); }
  const c = { id: ++uid, kind, name: file.name, url, fileId: fromId || '' };
  if (kind === 'video') {
    const el = document.createElement('video'); el.src = url; el.preload = 'auto'; el.playsInline = true; el.crossOrigin = 'anonymous';
    await new Promise((res, rej) => { el.onloadedmetadata = res; el.onerror = () => rej(new Error('This video can’t be opened here. Try an MP4.')); }).catch(e => { toast(esc(e.message)); throw e; });
    c.el = el; c.dur = el.duration || 5; c.a = 0; c.b = Math.min(c.dur, 60); c.w = el.videoWidth; c.h = el.videoHeight;
  } else { const im = new Image(); im.src = url; await im.decode().catch(() => {}); c.el = im; c.dur = E.imgDur; c.w = im.naturalWidth; c.h = im.naturalHeight; }
  c.thumb = await makeThumb(file).catch(() => ''); E.clips.push(c); wire(c); setVol(); paintSide(); seek(E.t); toast(`${esc(file.name)} added`);
}
function drawMedia(el, w, h, W, H, fit) {
  if (!w || !h) return; const sc = fit === 'cover' ? Math.max(W / w, H / h) : Math.min(W / w, H / h), dw = w * sc, dh = h * sc;
  if (fit !== 'cover') { cx.save(); cx.filter = 'blur(28px) brightness(.55)'; const s2 = Math.max(W / w, H / h) * 1.1; cx.drawImage(el, (W - w * s2) / 2, (H - h * s2) / 2, w * s2, h * s2); cx.restore(); }
  cx.drawImage(el, (W - dw) / 2, (H - dh) / 2, dw, dh);
}
const FILTERS = { none: 'none', bright: 'brightness(1.1) saturate(1.2)', warm: 'sepia(.22) saturate(1.25) brightness(1.03)', cool: 'hue-rotate(-10deg) saturate(1.15) brightness(1.02)', mono: 'grayscale(1) contrast(1.12)', dream: 'saturate(1.4) contrast(.95) brightness(1.08)' };

    veSet: d => { if (d.k === 'beat') { E.beat = d.v; ensureAudio(); if (E.playing) beatPlay(); else if (d.v !== 'none') { actx?.state === 'suspended' && actx.resume(); const keep = E.t; beatPlay(); setTimeout(() => { if (!E.playing) beatStop(); }, 2200); E.t = keep; } } else if (d.k === 'trans') E.trans = d.v; else if (['aspect', 'filter', 'fit'].includes(d.k)) E[d.k] = d.v; else E.text[d.k] = d.k === 'secs' ? +d.v : d.v; if (d.k === 'aspect') setupCanvas(); document.querySelectorAll(`[data-a="veSet"][data-k="${d.k}"]`).forEach(b => b.classList.toggle('on', b.dataset.v === d.v)); frame(); },
    veAdd: async () => { const fs = await pickFile('video/*,image/*', true); for (const f of fs) await addMedia(f).catch(() => {}); },
    veMusic: async () => { const [f] = await pickFile('audio/*'); if (f) addMedia(f); },
    veNoMusic: () => { E.music?.el.pause(); E.music = null; paintSide(); },
    veFromStudio: () => { const M = (S.data.file || []).filter(f => f.ready && /^(video|image|audio)\//.test(f.type)); openModal(() => `<div class="k-mhead"><b>Add from Studio</b><button class="k-x" data-a="close">${icon('x', 18)}</button></div>${M.length ? `<div class="k-grid">${M.map(f => `<button class="k-file glass" data-a="useFile" data-v="${f.id}"><span class="k-thumb">${f.thumb ? `<img src="${esc(f.thumb)}" alt="">` : '🎵'}</span><span class="k-fname">${esc(f.name)}</span></button>`).join('')}</div>` : '<p class="mute">No videos or pictures in Studio yet.</p>'}`); },
    useFile: async d => { const f = (S.data.file || []).find(x => x.id === d.v); S.modal = null; if (S.tab !== 'editor') { S.tab = 'editor'; render(); } else render(); toast('Getting the file…', 0); try { const b = await getBlob(f); await addMedia(new File([b], f.name, { type: f.type }), f.id); } catch (e) { toast(esc(e.message)); } },
    veMove: d => { const i = E.clips.findIndex(c => c.id === +d.v), j = i + +d.d; if (j < 0 || j >= E.clips.length) return; [E.clips[i], E.clips[j]] = [E.clips[j], E.clips[i]]; paintSide(); seek(E.t); },
    veMute: d => { const c = E.clips.find(x => x.id === +d.v); c.mute = !c.mute; setVol(); paintSide(); },
    veDel: d => { const i = E.clips.findIndex(c => c.id === +d.v); if (i < 0) return; pause(); E.clips.splice(i, 1); paintSide(); seek(Math.min(E.t, total())); },
    veExport: exportVideo,
    veCancel: () => { if (E.rec) { E.rec._cancel = true; } pause(); },
    veDl: () => { download(S.lastExport.blob, S.lastExport.name); toast('Downloaded'); },
    veSave: async () => { const x = S.lastExport; S.modal = null; render(); try { const id = await uploadFile(x.file, 'video', { dur: total() }); if (id && confirm('Saved to Studio. Plan a post with this video now?')) { S.tab = 'plan'; render(); postModal({ title: E.text.t || E.clips.find(c => c.text)?.text || '', text: S.aiCaption || '', status: 'making', fileId: id, platforms: [] }); } } catch (e) { toast(esc(e.message)); } },
  },
});
addEventListener('beforeunload', e => { if (E.clips.length) { e.preventDefault(); e.returnValue = ''; } });
</script>
</body>
</html>
