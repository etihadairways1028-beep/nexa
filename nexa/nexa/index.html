<script>try{var g=JSON.parse(localStorage.getItem('nexa.sig')||'null');if(g)document.documentElement.dataset.sig=g;var q=JSON.parse(localStorage.getItem('nexa.lq')||'null');if(q)document.documentElement.dataset.lq=q;var x=JSON.parse(localStorage.getItem('nexa.txt')||'null');if(x){var nxR=document.documentElement;nxR.dataset.txt=x.txt||'';nxR.dataset.hd=x.hd||'';nxR.dataset.lqs=x.lqs||'1';for(var nxk in x.v)if(x.v[nxk])nxR.style.setProperty(nxk,x.v[nxk]);}var t=JSON.parse(localStorage.getItem('nexa.tint')||'null');if(t){document.documentElement.dataset.tint=t[0];document.documentElement.style.setProperty('--tint',t[1]);}var c=JSON.parse(localStorage.getItem('nexa.sigCol')||'null');if(c){var r=document.documentElement.style;r.setProperty('--prism','conic-gradient('+c+','+c+')');r.setProperty('--prismL','linear-gradient(90deg,'+c+','+c+')');r.setProperty('--prismEdge','linear-gradient('+c+','+c+')');r.setProperty('--glowA',c);r.setProperty('--glowB',c);}}catch(e){}</script>
