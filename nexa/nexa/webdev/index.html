<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Nexa Dev Hub</title>
<meta name="description" content="Nexa Dev Hub: where the Nexa web developers pick up tasks, share work and get reviews.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#09090F">
<link rel="icon" href="/favicon-v4.png">
<style>
.board{display:grid;grid-template-columns:repeat(6,minmax(210px,1fr));gap:12px;overflow-x:auto;padding-bottom:8px}
.col{padding:10px;display:flex;flex-direction:column;gap:8px;min-height:160px}
.col-h{display:flex;align-items:center;gap:8px;font-weight:800;font-size:13.5px;padding:2px 4px}.col-h i{width:10px;height:10px;border-radius:50%}
.tcard{padding:11px;border-radius:14px;background:rgba(255,255,255,.07);border:1px solid var(--line);cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:6px;transition:transform .15s}.tcard:hover{transform:translateY(-2px)}
.st-todo{background:#C9C7D2}.st-doing{background:#7FB2FF}.st-review{background:#FFD27A}.st-changes{background:#FF9DA8}.st-approved{background:#7BF0B8}.st-done{background:#B794FF}
.chip{display:inline-block;font-size:11.5px;font-weight:800;padding:3px 8px;border-radius:8px;color:#0B0B12}
.prio{font-size:11px;font-weight:800;padding:2px 7px;border-radius:99px;background:rgba(255,255,255,.1)}.prio.high{background:#FF9DA8;color:#2a0008}
.tmeta{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:12.5px;color:var(--mute)}
.rv{padding:16px;display:flex;flex-direction:column;gap:10px}
.pg{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px}
.pg-ed{padding:12px;display:flex;flex-direction:column;gap:10px}
.pg-tabs{display:flex;gap:4px}.pg-tabs button{height:34px;padding:0 14px;border-radius:10px;border:1px solid var(--line2);background:rgba(255,255,255,.05);cursor:pointer;font-weight:700;font-size:13px}.pg-tabs button.on{background:#F3F1EC;color:#0B0B12}
.pg textarea{width:100%;height:56vh;min-height:300px;resize:vertical;border-radius:14px;border:1px solid var(--line2);background:rgba(0,0,0,.45);color:#E8E6F0;font:13px/1.55 ui-monospace,Menlo,Consolas,monospace;padding:12px;outline:none;tab-size:2}
.pg-out{padding:12px;display:flex;flex-direction:column;gap:10px}.pg-out iframe{width:100%;height:56vh;min-height:300px;border:0;border-radius:14px;background:#fff}
.cx{display:grid;grid-template-columns:240px minmax(0,1fr) 320px;gap:14px;align-items:start}
.cx-files,.cx-change{padding:12px;position:sticky;top:64px;max-height:calc(100vh - 90px);overflow:auto}
.cx-list{display:flex;flex-direction:column;gap:2px}.cx-f{display:flex;gap:6px;justify-content:space-between;text-align:left;padding:6px 8px;border-radius:9px;border:0;background:none;cursor:pointer;font:12.5px ui-monospace,Menlo,monospace;color:#d6d4e0}.cx-f:hover{background:rgba(255,255,255,.07)}.cx-f.on{background:rgba(140,151,255,.25);color:#fff}.cx-f i{font-style:normal;color:var(--mute);font-size:11px}
.cx-f span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cx-main{padding:14px;min-width:0}.cx-bar{gap:10px;margin-bottom:10px}.cx-path{font:700 14px ui-monospace,Menlo,monospace}
.cx-code{height:58vh;overflow:auto;background:rgba(0,0,0,.4);border-radius:14px;padding:6px 0;font:12.5px/1.55 ui-monospace,Menlo,Consolas,monospace;border:1px solid rgba(255,255,255,.08)}
.cx-l{display:flex;white-space:pre}.cx-l.on{background:rgba(140,151,255,.22)}.cx-n{width:56px;flex:none;text-align:right;padding:0 10px 0 0;color:#6f6d7b;border:0;background:none;cursor:pointer;font:inherit}.cx-n:hover{color:#fff}.cx-l code{background:none;padding:0;font:inherit;color:#e8e6f0}
.cx-cf{margin:6px 0;border-radius:12px;background:rgba(255,255,255,.05);padding:8px 10px}.cx-cf summary{cursor:pointer;display:flex;gap:8px;align-items:center;font-size:13px}.cx-cf summary b{font:700 12.5px ui-monospace,Menlo,monospace;flex:1;overflow:hidden;text-overflow:ellipsis}
.ve-x{border:0;background:none;color:var(--mute);cursor:pointer}
.apck{display:flex;gap:8px;align-items:center;font-size:14px;padding:3px 0;cursor:pointer}.apck input{width:18px;height:18px;accent-color:#8C97FF}.tchecks{display:grid;grid-template-columns:1fr 1fr;gap:2px 12px;margin-bottom:10px}
@media (max-width:1180px){.cx{grid-template-columns:200px minmax(0,1fr)}.cx-change{grid-column:1/-1;position:static;max-height:none}}
.pg-ai{display:flex;gap:10px;align-items:center;padding:10px 10px 10px 12px;border-radius:999px}.pg-ai .k-in{flex:1;border-radius:999px}
.pgframe{display:grid;place-items:center;background:rgba(0,0,0,.25);border-radius:14px}.pgframe iframe{transition:width .3s}
.pgcons{font-size:13px;display:flex;flex-direction:column;gap:6px}.pgerr{font:12px ui-monospace,Menlo,monospace;color:#FFB3BC;max-height:110px;overflow:auto;background:rgba(0,0,0,.3);border-radius:10px;padding:8px}
.prio.normal{background:rgba(255,255,255,.1)}.prio.low{opacity:.75}
.next{display:flex;gap:12px;align-items:center;padding:10px;border-radius:14px;background:rgba(255,255,255,.05);cursor:pointer;border:0;width:100%;text-align:left}
@media (max-width:860px){.board{grid-template-columns:repeat(6,80vw)}.pg{grid-template-columns:1fr}.pg textarea,.pg-out iframe{height:42vh}}
</style>
</head>
<body>
<div id="app"></div>
<script type="module">
import { boot, S, api, esc, icon, toast, ago, avatar, render, reload, openModal, closeModal, askAI, uploadFile, vComments, linkify, download, makeZip } from '/team/kit.js';

const ST = [['todo', 'To do'], ['doing', 'Doing'], ['review', 'Review'], ['changes', 'Needs changes'], ['approved', 'Approved'], ['done', 'Done']];
const STN = Object.fromEntries(ST);
const T = () => S.data.task || [];

function vHome() {
  const D = S.data, mine = T().filter(t => t.who === D.me.id && t.status !== 'done');
  const news = T().filter(t => (t.comments || []).some(c => c.owner)).sort((a, b) => (b.decidedAt || 0) - (a.decidedAt || 0)).slice(0, 4);
  return `<div class="k-head"><div><h1 class="k-h1">Hi ${esc(D.me.name)} 👋</h1><p class="mute">Pick up tasks, share your work and get it reviewed.</p></div>
    <div class="k-row"><button class="k-btn ai" data-a="ideas">${icon('spark', 18)} What should we improve?</button><button class="k-btn pri" data-a="tab" data-v="play">${icon('code', 18)} Build with AI</button><button class="k-btn" data-a="newTask">${icon('plus', 18)} New task</button></div></div>
  ${tester() ? `<section class="glass k-card" style="margin-bottom:16px"><h3 style="margin:0 0 10px">🧪 Builds waiting for your test</h3>${B().filter(b => b.status === 'testing').map(bRow).join('') || '<div class="mute">Nothing to test right now. You’ll see new builds here.</div>'}</section>` : ''}
  <div class="k-cards" style="margin-bottom:16px">${[['To do', T().filter(t => t.status === 'todo').length, '#C9C7D2'], ['Doing', T().filter(t => t.status === 'doing').length, '#7FB2FF'], ['Waiting for review', T().filter(t => t.status === 'review').length, '#FFD27A'], ['Done', T().filter(t => t.status === 'done').length, '#B794FF']].map(([l, n, c]) => `<div class="glass k-card k-stat"><span class="mute small" style="display:flex;align-items:center;gap:8px"><i style="width:9px;height:9px;border-radius:50%;background:${c}"></i>${l}</span><b>${n}</b></div>`).join('')}</div>
  <div class="k-cards" style="grid-template-columns:repeat(auto-fit,minmax(300px,1fr))">
    <section class="glass k-card"><h3 style="margin:0 0 10px">Your tasks</h3>${mine.length ? mine.map(t => `<button class="next" data-a="openTask" data-v="${t.id}"><span class="chip st-${t.status}">${esc(STN[t.status])}</span><span style="min-width:0"><b>${esc(t.title)}</b><div class="mute small">${t.prio === 'high' ? '🔥 High · ' : ''}${ago(t.updatedAt || t.at)}</div></span></button>`).join('') : '<div class="mute">Nothing on your plate. Grab one from <a href="#" data-a="tab" data-v="tasks">Tasks</a>.</div>'}</section>
    <section class="glass k-card"><h3 style="margin:0 0 10px">From the owner</h3>${news.length ? news.map(t => { const c = [...t.comments].reverse().find(c => c.owner); return `<button class="next" data-a="openTask" data-v="${t.id}"><span class="chip st-${t.status}">${esc(STN[t.status])}</span><span style="min-width:0"><b>${esc(t.title)}</b><div class="mute small">“${esc(c.text)}” · ${ago(c.at)}</div></span></button>`; }).join('') : '<div class="mute">When the owner approves work or asks for changes, it shows here.</div>'}</section>
    <section class="glass k-card"><h3 style="margin:0 0 10px">Your builds</h3>${B().filter(b => b.by === D.me.id).slice(0, 5).map(bRow).join('') || '<div class="mute">No builds yet. Open <a href="#" data-a="tab" data-v="play">Playground</a> and tell Nexa AI what to make.</div>'}</section>
    <section class="glass k-card"><h3 style="margin:0 0 10px">How it works</h3><ol class="mute" style="margin:0;padding-left:20px;line-height:1.8"><li>Tell <b>Nexa AI</b> what to build in the Playground</li><li>Check it, then press <b>Send to testers</b></li><li>Testers approve it, or send back issues</li><li>Issues? Press <b>Fix with AI</b> and send again</li><li>Approved builds go to the owner to add to <b>real Nexa</b></li></ol></section>
  </div>`;
}
function vTasks() {
  return `<div class="k-head"><div><h1 class="k-h1">Tasks</h1><p class="mute">Everything the web team is working on.</p></div><button class="k-btn pri" data-a="newTask">${icon('plus', 18)} New task</button></div>
  <div class="board">${ST.map(([k, l]) => { const L = T().filter(t => t.status === k).sort((a, b) => (b.prio === 'high') - (a.prio === 'high')); return `<section class="glass col"><div class="col-h"><i class="st-${k}"></i>${l} <span class="mute">${L.length}</span></div>${L.map(card).join('') || '<span class="mute small" style="padding:4px">Nothing here</span>'}</section>`; }).join('')}</div>`;
}
const nameOf = id => (S.data.team.find(t => t.id === id) || {}).name || '';
const card = t => `<button class="tcard" data-a="openTask" data-v="${t.id}"><b>${esc(t.title)}</b><span class="tmeta">${t.prio !== 'normal' ? `<span class="prio ${t.prio}">${t.prio === 'high' ? '🔥 High' : 'Low'}</span>` : ''}${t.who ? `${avatar(nameOf(t.who) || '?', 20)} ${esc(nameOf(t.who))}` : '<span>Free to take</span>'}${(t.comments || []).length ? ` · 💬 ${t.comments.length}` : ''}${t.link ? ' · 🔗' : ''}</span></button>`;
function vReviews() {
  const L = T().filter(t => ['review', 'changes'].includes(t.status));
  return `<div class="k-head"><div><h1 class="k-h1">Reviews</h1><p class="mute">Check each other's work. The owner gives the final OK.</p></div><button class="k-btn ai" data-a="aiReview">${icon('spark', 18)} Review code with AI</button></div>
  ${L.length ? `<div style="display:flex;flex-direction:column;gap:12px">${L.map(t => `<section class="glass rv"><div class="k-row" style="justify-content:space-between"><div><span class="chip st-${t.status}">${esc(STN[t.status])}</span> <b style="font-size:17px;margin-left:6px">${esc(t.title)}</b></div><span class="mute small">${esc(nameOf(t.who) || t.name)} · ${ago(t.updatedAt || t.at)}</span></div>
    ${t.text ? `<div class="mute" style="white-space:pre-wrap">${linkify(esc(t.text))}</div>` : ''}${t.link ? `<a href="${esc(t.link)}" target="_blank" rel="noopener" class="k-btn sm" style="align-self:flex-start">🔗 Open the work</a>` : ''}
    <div class="k-row"><button class="k-btn sm" data-a="openTask" data-v="${t.id}">Open</button><button class="k-btn sm" data-a="lgtm" data-v="${t.id}">👍 Looks good</button></div></section>`).join('')}</div>`
    : `<div class="k-empty glass">${icon('eye', 34)}<b>Nothing to review</b><span class="mute">When someone presses "Send for review" on a task, it shows here.</span></div>`}`;
}
// ---------- builds: code → testers → owner adds it to the real Nexa
const BST = { draft: ['Draft', '#C9C7D2'], testing: ['Testing', '#FFD27A'], issues: ['Needs fixes', '#FF9DA8'], verified: ['Verified ✓', '#7BF0B8'], shipped: ['In real Nexa', '#B794FF'] };
const B = () => S.data.build || [];
const TCHECKS = ['Works on a phone', 'Every button does something', 'Looks right (liquid glass)', 'No errors or freezes', 'Nothing else in Nexa broke'];
const devInfo = () => { const u = navigator.userAgent; const os = /iPhone|iPad/.test(u) ? 'iOS' : /Android/.test(u) ? 'Android' : /Mac/.test(u) ? 'Mac' : /Windows/.test(u) ? 'Windows' : /CrOS/.test(u) ? 'Chromebook' : 'Other'; const br = /Edg\//.test(u) ? 'Edge' : /Chrome\//.test(u) ? 'Chrome' : /Safari\//.test(u) ? 'Safari' : /Firefox\//.test(u) ? 'Firefox' : 'Browser'; return `${os} · ${br} · ${innerWidth}×${innerHeight}`; };
const tester = () => S.data.me.role === 'tester';
const bChip = st => `<span class="chip" style="background:${(BST[st] || BST.draft)[1]}">${esc((BST[st] || BST.draft)[0])}</span>`;
const bRow = b => `<button class="next" data-a="openBuild" data-v="${b.id}">${bChip(b.status)}<span style="min-width:0"><b>${esc(b.title)}</b><div class="mute small">v${b.version || 1} · ${esc(b.name || '')} · ${ago(b.updatedAt || b.at)}${(b.issues || []).length ? ' · ' + b.issues.length + ' issue' + (b.issues.length > 1 ? 's' : '') : ''}</div></span></button>`;
function vBuilds() {
  const L = B(), f = S.bf || (tester() ? 'testing' : 'all'), list = L.filter(b => f === 'all' || b.status === f);
  return `<div class="k-head"><div><h1 class="k-h1">Builds &amp; testing</h1><p class="mute">${tester() ? 'Open a build, try it, then approve it or send back what’s wrong.' : 'Send builds to the testers. When they approve, the owner adds them to real Nexa.'}</p></div><button class="k-btn pri" data-a="tab" data-v="play">${icon('plus', 18)} New build</button></div>
  <div class="k-pills">${[['all', 'All'], ['draft', 'Drafts'], ['testing', 'Testing'], ['issues', 'Needs fixes'], ['verified', 'Verified'], ['shipped', 'In real Nexa']].map(([k, l]) => `<button class="k-pill ${f === k ? 'on' : ''}" data-a="bf" data-v="${k}">${l} <span class="mute">${k === 'all' ? L.length : L.filter(b => b.status === k).length}</span></button>`).join('')}</div>
  ${list.length ? `<div class="k-cards">${list.map(b => `<button class="glass k-card bcard" data-a="openBuild" data-v="${b.id}" style="text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:8px"><div class="k-row" style="justify-content:space-between">${bChip(b.status)}<span class="mute small">v${b.version || 1}</span></div><b style="font-size:17px">${esc(b.title)}</b><span class="mute small">${esc(b.notes || '').slice(0, 120)}</span><span class="mute small">${esc(b.name || '')} · ${ago(b.updatedAt || b.at)}</span></button>`).join('')}</div>` : `<div class="k-empty glass">${icon('check', 34)}<b>Nothing here</b><span class="mute">${tester() ? 'Builds sent for testing show up here.' : 'Make something in the Playground and press Send to testers.'}</span></div>`}`;
}
const fullDoc = c => `<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>${esc(c.title || 'Nexa build')}</title><style>${c.css || ''}</style></head><body>${c.html || ''}<script>${String(c.js || '').replace(/<\/script/gi, '<\\/script')}<\/script></body></html>`;
function buildModal(id) {
  openModal(() => { const b = B().find(x => x.id === id); if (!b) return '<div class="mute">Not found</div>'; const mine = b.by === S.data.me.id;
    return `<div class="k-mhead"><b>${esc(b.title)}</b><button class="k-x" data-a="close">${icon('x', 18)}</button></div>
    <div class="k-row">${bChip(b.status)}<span class="mute small">v${b.version || 1} · by ${esc(b.name || '')} · ${ago(b.updatedAt || b.at)}</span></div>
    ${b.notes ? `<p class="mute" style="margin:8px 0">${esc(b.notes)}</p>` : ''}
    ${b.html || b.js ? `<div class="k-prev" style="min-height:340px"><iframe id="bprev" sandbox="allow-scripts allow-modals" title="Build preview" style="height:46vh"></iframe></div>` : ''}
    ${(b.files || []).length ? `<div class="mute small" style="margin:8px 0">📦 A change to the real Nexa · ${b.files.length} file${b.files.length > 1 ? 's' : ''}. Testers: read the code (or ask AI), then try it on the test site once it’s added there.</div>${b.files.map(f => `<details class="cx-cf"><summary><b>${esc(f.path)}</b> <span class="mute small">${esc(f.how || f.mode)}</span></summary><pre class="k-code" style="max-height:260px">${esc(f.code)}</pre></details>`).join('')}` : ''}
    <div class="k-row" style="margin:10px 0">
      <button class="k-btn" data-a="bOpen" data-v="${b.id}">${icon('code', 16)} Open in Playground</button>
      ${(b.files || []).length ? `<button class="k-btn" data-a="bZip" data-v="${b.id}">${icon('dl', 16)} Download files</button>` : `<button class="k-btn" data-a="bDl" data-v="${b.id}">${icon('dl', 16)} Download</button>`}
      ${(mine || !tester()) && b.status === 'issues' ? `<button class="k-btn ai" data-a="bFix" data-v="${b.id}">${icon('spark', 16)} Fix with AI</button>` : ''}
      ${(mine || !tester()) && b.status === 'draft' ? `<button class="k-btn pri" data-a="bSend" data-v="${b.id}">${icon('send', 16)} Send to testers</button>` : ''}
    </div>
    ${tester() && b.status === 'testing' ? `<div class="glass" style="padding:14px;border-radius:18px;margin:6px 0 12px"><b>Your test</b><div class="mute small" style="margin:4px 0 8px">Try everything: buttons, phone size, typing, mistakes. Then approve it or say what’s wrong.</div>
      <div class="tchecks">${TCHECKS.map((c, i) => `<label class="apck"><input type="checkbox" class="tck" value="${esc(c)}"> ${esc(c)}</label>`).join('')}</div>
      <textarea class="k-in" id="tnote" placeholder="What’s wrong? (needed to send back) e.g. The send button does nothing on phones."></textarea>
      <div class="k-row" style="margin-top:8px"><button class="k-btn sm" data-a="bShot">📷 ${S.testShot ? 'Screenshot attached ✓' : 'Attach a screenshot'}</button><span class="mute small">Your device is added automatically: ${esc(devInfo())}</span></div>
      <div class="k-row" style="margin-top:10px"><button class="k-btn pri" data-a="bOk" data-v="${b.id}">✅ Approve</button><button class="k-btn danger" data-a="bNo" data-v="${b.id}">Send back with issues</button><button class="k-btn ai" data-a="bAiTest" data-v="${b.id}">${icon('spark', 16)} Find problems with AI</button></div></div>` : ''}
    ${b.status === 'verified' ? '<div class="k-note">✅ Testers approved this. The owner will add it to real Nexa.</div>' : ''}${b.status === 'shipped' ? '<div class="k-note">🎉 This is in real Nexa now.</div>' : ''}
    ${(b.issues || []).length ? `<div class="k-comments"><div class="mute small" style="margin-bottom:8px">Issues · ${b.issues.length}</div>${b.issues.slice().reverse().map(i => `<div class="k-cm ${i.owner ? 'own' : ''}">${avatar(i.name, 26)}<div><b>${esc(i.name)}</b> <span class="mute small">v${i.version || ''} · ${ago(i.at)}</span><div style="white-space:pre-wrap">${esc(i.text)}</div></div></div>`).join('')}</div>` : ''}
    ${(b.tests || []).length ? `<div class="k-comments"><div class="mute small" style="margin-bottom:8px">Tests</div>${b.tests.slice().reverse().map(t => `<div class="k-cm">${avatar(t.name, 26)}<div><b>${esc(t.name)}</b> ${t.ok ? '✅ approved' : '🔧 sent back'} <span class="mute small">v${t.version || 1} · ${ago(t.at)}${t.device ? ' · ' + esc(t.device) : ''}</span>${(t.checks || []).length ? `<div class="mute small">✓ ${t.checks.map(esc).join(' · ')}</div>` : ''}${t.shot ? `<div><a href="#" data-a="openFile" data-v="${t.shot}">📷 Screenshot</a></div>` : ''}</div></div>`).join('')}</div>` : ''}`; },
  () => { const f = document.getElementById('bprev'), b = B().find(x => x.id === id); if (f && b && !f.dataset.ok) { f.dataset.ok = 1; f.srcdoc = fullDoc(b); } });
  S.testShot = '';
}
// ---------- Nexa code: browse the real app, ask Nexa AI what to add, and let it write the change
const GH = 'etihadairways1028-beep/nexa', BASE = 'nexa/nexa/';
const FALLBACK = ['source/app.js', 'app.js', 'styles.css', 'store.js', 'index.html', 'sw.js', 'support/index.html', 'owner/index.html', 'hiring/index.html', 'videoeditor/index.html', 'webdev/index.html', 'team/kit.js', 'server/team.mjs', 'server/support.mjs', 'server/owner.mjs', 'server/jobs.mjs', 'server/ai.mjs', 'server/gemini.mjs', 'functions/api/[fn].js', 'firestore.rules'];
const C = { files: null, path: '', lines: [], top: 0, sel: null, q: '', filter: '', change: { title: '', files: [] }, busy: '' };
try { const k = JSON.parse(localStorage.getItem('nexa.devhub.change') || 'null'); if (k) C.change = k; } catch {}
const saveChange = () => { try { localStorage.setItem('nexa.devhub.change', JSON.stringify(C.change)); } catch {} };
const WIN = 260;
async function loadTree() {
